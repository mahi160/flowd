name: release

on:
  push:
    branches: [prod]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  # ── 1. Build dashboard artifact & run tests ──────────────────────────────
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build dashboard artifact
        run: make dashboard

      - name: Commit dashboard artifact if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- internal/fw/static/dashboard.html; then
            git add internal/fw/static/dashboard.html
            git commit -m "build: update dashboard artifact [skip ci]"
            git push origin HEAD:prod
          fi

      - name: Test
        run: go test ./...

  # ── 2. Automatically generate changelog, tag, and publish release ────────
  semantic-release:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.semantic.outputs.new_release_published }}
      tag_name: ${{ steps.semantic.outputs.new_release_git_tag }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build multi-platform binaries and attach to the GitHub Release ────
  build:
    needs: semantic-release
    if: ${{ needs.semantic-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/mahi160/flowd/internal/fw.Version=${{ needs.semantic-release.outputs.version }}" \
            -o fw-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/fw

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.semantic-release.outputs.tag_name }} \
            fw-${{ matrix.goos }}-${{ matrix.goarch }} --clobber
