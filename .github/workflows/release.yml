name: release

on:
  push:
    branches: [prod]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  # ── 1. Build dashboard artifact & run tests ──────────────────────────────
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard artifact
        run: make dashboard

      - name: Commit dashboard artifact if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- internal/fw/static/dashboard.html; then
            git add internal/fw/static/dashboard.html
            git commit -m "build: update dashboard artifact [skip ci]"
            git push origin HEAD:prod
          fi

      - name: Test
        run: go test ./...

  # ── 2. Create / update Release-Please PR; publish release when PR merges ─
  release-please:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Updated from v4 to v5 to fix the Node 20 deprecation warning
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build multi-platform binaries and attach to the GitHub Release ────
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/mahi160/flowd/internal/fw.Version=${{ needs.release-please.outputs.version }}" \
            -o fw-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/fw

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            fw-${{ matrix.goos }}-${{ matrix.goarch }} --clobber
