<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>flowd — dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="base.css"/>
<!-- Apply stored theme before render to prevent flash -->
<script>
  (function () {
    var stored   = localStorage.getItem('fw-theme') || 'system';
    var resolved = stored === 'system'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : stored;
    document.documentElement.setAttribute('data-theme', resolved);
  })();
</script>
</head>
<body>
<div id="app"></div>
<!-- Data injected by Go -->
<script>window.__RAW = __FLOWD_DATA__;</script>
<!-- ES module entry point -->
<script type="module" src="js/app.js"></script>
</body>
</html>
