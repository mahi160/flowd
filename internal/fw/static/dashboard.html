<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flowd — dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="base.css" />
    <script>
      (() => {
        const saved = localStorage.getItem("fw-theme") || "system";
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          saved === "system" ? (dark ? "dark" : "light") : saved;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.__RAW = window.__FLOWD_DATA__ || {};
    </script>
    <script src="https://unpkg.com/preact@10.26.4/dist/preact.min.js"></script>
    <script src="https://unpkg.com/preact@10.26.4/hooks/dist/hooks.umd.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
      const { render } = preact;
      const { useEffect, useMemo, useState, useCallback } = preactHooks;
      const html = htm.bind(preact.h);

      const PALETTE = [
        "var(--c1)",
        "var(--c2)",
        "var(--c3)",
        "var(--c4)",
        "var(--c5)",
        "var(--c6)",
        "var(--c7)",
        "var(--c8)",
      ];
      const THEMES = ["dark", "light", "system"];
      const ICONS = {
        dark: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
        light: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
        system: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
      };

      function resolvedTheme(t) {
        return t === "system"
          ? matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
          : t;
      }

      function fmtHM(m) {
        m = Math.max(0, m || 0);
        const h = Math.floor(m / 60),
          r = m % 60;
        return h ? `${h}h ${r}m` : `${r}m`;
      }

      function fmtHour(h) {
        return h === 0
          ? "12a"
          : h < 12
            ? `${h}a`
            : h === 12
              ? "12p"
              : `${h - 12}p`;
      }

      function polar(cx, cy, r, a) {
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      }

      function arcPath(cx, cy, ro, ri, start, end) {
        const large = end - start > Math.PI ? 1 : 0;
        const [x1, y1] = polar(cx, cy, ro, start),
          [x2, y2] = polar(cx, cy, ro, end);
        const [x3, y3] = polar(cx, cy, ri, end),
          [x4, y4] = polar(cx, cy, ri, start);
        return `M ${x1} ${y1} A ${ro} ${ro} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${ri} ${ri} 0 ${large} 0 ${x4} ${y4} Z`;
      }

      function toList(obj, key = "min") {
        return Object.entries(obj || {})
          .filter(([, v]) => v > 0)
          .sort((a, b) => b[1] - a[1])
          .map(([name, value], i) => ({
            name,
            [key]: value,
            color: PALETTE[i % PALETTE.length],
          }));
      }

      function transform(raw) {
        const heat = raw.heatmap || [];
        const isToday = raw.period === "today";
        const hourly = Array(24).fill(0);

        for (const c of heat) {
          const h = isToday ? Math.floor(c.hour / 2) : c.hour;
          if (h >= 0 && h < 24) hourly[h] += c.minute;
        }

        const byDay = {},
          byDayHour = {};
        for (const c of heat) {
          byDay[c.day] = (byDay[c.day] || 0) + c.minute;
          byDayHour[c.day] ||= Array(24).fill(0);
          if (c.hour >= 0 && c.hour < 24) byDayHour[c.day][c.hour] += c.minute;
        }

        return {
          period: raw.period || "today",
          generated: raw.generated || "",
          machine: raw.machine || "—",
          os: raw.os || "",
          topRepo: { name: raw.top_repo || "—", branch: raw.top_branch || "" },
          focus: {
            totalMin: raw.total_focus_min || 0,
            blocks: raw.total_blocks || 0,
            switches: raw.total_switches || 0,
          },
          code: {
            files: raw.files_changed || 0,
            added: raw.lines_added || 0,
            removed: raw.lines_removed || 0,
          },
          byProject: toList(raw.by_project),
          byCommand: toList(raw.by_tool),
          byLanguage: toList(raw.languages),
          hourly,
          weekHourlyByDay: byDayHour,
          weekDays: Object.entries(byDay).map(([label, min]) => {
            const [day, date = ""] = label.split(" ");
            return { day, date, min };
          }),
          streakDays: raw.streak_days || 0,
          streakCells: Array.from({ length: 30 }, (_, i) => {
            const ago = 29 - i,
              s = raw.streak_days || 0;
            return {
              d: i,
              v:
                ago < s
                  ? ago === 0
                    ? 4
                    : Math.min(4, ((i * 7 + 3) % 3) + 2)
                  : ago < s + 8 && (i * 13) % 4 === 0
                    ? 1
                    : 0,
            };
          }),
          timeline: (raw.timeline || []).map((b) => ({
            from: b.start,
            to: b.end,
            project: b.repo || null,
            branch: b.branch || null,
            focus: b.focus || 0,
            switches: b.switches || 0,
            ai: b.ai || null,
          })),
          aiRecap: raw.ai_recap || null,
          aiPerBlock: raw.ai_per_block || 0,
          hasData: (raw.total_blocks || 0) > 0,
        };
      }

      const SvgIcon = ({ children, size = 16 }) =>
        html`<span
          dangerouslySetInnerHTML=${{ __html: children }}
          style=${{ width: size, height: size, display: "inline-flex" }}
        />`;

      const BranchIcon = ({ size = 12 }) =>
        html`<svg width=${size} height=${size} viewBox="0 0 16 16" fill="none">
          <path
            d="M4 2v8a3 3 0 0 0 3 3h5M12 13l-2-2m2 2-2 2M4 6h5a3 3 0 0 0 3-3V2"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>`;

      function FlowMark({ size = 40 }) {
        return html`<svg
          width=${size}
          height=${size}
          viewBox="0 0 64 64"
          fill="none"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="flowmark-grad" x1="10" y1="54" x2="54" y2="10">
              <stop stop-color="var(--moss)" />
              <stop offset=".55" stop-color="var(--fern)" />
              <stop offset="1" stop-color="var(--amber)" />
            </linearGradient>
          </defs>
          <path
            d="M17 41c9 0 10-18 22-18 5 0 8 3 8 8 0 12-15 18-25 9"
            stroke="url(#flowmark-grad)"
            stroke-width="7"
            stroke-linecap="round"
          />
          <circle cx="17" cy="41" r="5" fill="var(--moss)" />
          <circle cx="47" cy="31" r="5" fill="var(--amber)" />
        </svg>`;
      }

      function Sparkline({ data }) {
        const { max, pts } = useMemo(() => {
          const m = Math.max(1, ...data);
          const p = data
            .map((v, i) => `${(i / 23) * 180},${32 - (v / m) * 28}`)
            .join(" ");
          return { max: m, pts: p };
        }, [data]);

        return html`<svg class="sparkline" viewBox="0 0 180 36">
          <polyline
            points=${pts}
            fill="none"
            stroke="var(--accent)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity=".9"
          />
          <line x1="0" y1="34" x2="180" y2="34" stroke="var(--hairline-soft)" />
        </svg>`;
      }

      function Header({ data, view, setView, theme, cycleTheme }) {
        return html`<header class="header">
          <div class="brand">
            <${FlowMark} />
            <div>
              <div class="brand-name font-display">flowd</div>
              <div class="brand-sub">
                <span class="eyebrow">Generated</span
                ><span class="brand-stamp tnum">${data.generated}</span>
                ${data.hasData &&
                html`<span>·</span
                  ><span class="chip"
                    ><span class="status-dot" />${data.period}</span
                  >`}
              </div>
            </div>
          </div>
          <div class="header-right">
            <div class="seg">
              ${["today", "week"].map(
                (v) => html`
                  <button
                    key=${v}
                    class=${view === v ? "is-active" : ""}
                    title=${v !== data.period
                      ? `Run fw dashboard ${v} to generate ${v} data`
                      : ""}
                    onClick=${() => setView(v)}
                  >
                    ${v === "today" ? "Today" : "Week"}
                  </button>
                `,
              )}
            </div>
            <button
              class="icon-btn"
              title=${`Theme: ${theme}`}
              onClick=${cycleTheme}
            >
              <${SvgIcon} children=${ICONS[theme]} size=${18} />
            </button>
          </div>
        </header>`;
      }

      function HeroStrip({ data, label }) {
        const f = data.focus,
          c = data.code,
          top = data.byProject[0];
        return html`<section class="hero-strip">
          <div class="card hero-card hero-primary">
            <div class="eyebrow">Focus ${label}</div>
            <div class="hero-num font-display tnum">
              ${Math.floor(f.totalMin / 60)}<span class="hero-unit">h</span
              >${f.totalMin % 60}<span class="hero-unit">m</span>
            </div>
            <div class="hero-sub">
              <span class="tnum">${f.blocks}</span> focus blocks
              <span class="dim">·</span>
              <span class="tnum">${f.switches}</span> context switches
            </div>
            <${Sparkline} data=${data.hourly} />
          </div>
          <div class="card hero-card">
            <div class="eyebrow">Machine</div>
            <div class="hero-mid font-display">${data.machine}</div>
            <div class="hero-sub">${data.os}</div>
            <div class="machine-bar"><span style=${{ width: "50%" }} /></div>
          </div>
          <div class="card hero-card">
            <div class="eyebrow">Top repo</div>
            <div class="hero-mid font-display">${data.topRepo.name}</div>
            ${data.topRepo.branch &&
            html`<div class="hero-sub">
              <span class="branch-tag"
                ><${BranchIcon} /> ${data.topRepo.branch}</span
              >
            </div>`}
            ${top &&
            html`<div class="hero-mini tnum">${top.name} · ${top.min}m</div>`}
          </div>
          <div class="card hero-card">
            <div class="eyebrow">Code</div>
            <div class="hero-mid font-display tnum">${c.files} files</div>
            <div class="hero-sub">
              <span class="tnum diff-add">+${c.added}</span
              ><span class="dim"> / </span
              ><span class="tnum diff-rm">−${c.removed}</span>
            </div>
          </div>
        </section>`;
      }

      function HeatLegend() {
        return html`<span class="heat-legend">
          less
          ${[0.05, 0.3, 0.55, 0.8, 1].map(
            (i) =>
              html`<span key=${i} class="heat-cell" style=${{ "--i": i }} />`,
          )}
          more
        </span>`;
      }

      function ActivityHeatmap({ data }) {
        const { cells, peak, peakHour } = useMemo(() => {
          let p = 0,
            ph = 8;
          const c = Array.from({ length: 60 }, (_, i) => {
            const hour = 8 + Math.floor((i * 12) / 60);
            const v = data.hourly[Math.min(23, hour)] || 0;
            const noise = ((i * 13) % 7) / 6;
            const intensity = Math.max(
              0,
              Math.min(1, (v / 45) * (0.5 + noise * 0.6)),
            );

            if (intensity > p) {
              p = intensity;
              ph = hour;
            }

            return html`<span
              key=${i}
              class="heat-cell"
              style=${{ "--i": intensity }}
              title=${`~${hour}:00 — ≈${Math.round(intensity * 30)}m`}
            />`;
          });
          return { cells: c, peak: p, peakHour: ph };
        }, [data.hourly]);

        return html`<section class="card heatmap">
          <div class="card-head">
            <div class="card-title">Activity heatmap</div>
            <div class="card-sub">today · focus blocks by start time</div>
          </div>
          <div class="heat-axis">
            ${["8a", "10a", "12p", "2p", "4p", "6p", "8p"].map(
              (x) => html`<span key=${x}>${x}</span>`,
            )}
          </div>
          <div class="heat-cells">${cells}</div>
          <div class="heat-foot">
            <${HeatLegend} /><span
              >${peak > 0 ? `peak ~${peakHour}:00` : ""}</span
            >
          </div>
        </section>`;
      }

      function WeekHeatmap({ data }) {
        const days = Object.entries(data.weekHourlyByDay);
        const max = useMemo(
          () => Math.max(1, ...days.flatMap(([, h]) => h)),
          [days],
        );

        return html`<section class="card heatmap">
          <div class="card-head">
            <div class="card-title">Activity heatmap</div>
            <div class="card-sub">last 7 days × hour of day</div>
          </div>
          <div class="week-heat-grid">
            ${days.map(
              ([day, hrs]) => html`
                <div key=${day} class="week-heat-row">
                  <span class="week-heat-lbl">${day}</span>
                  <div class="week-heat-cells">
                    ${hrs.map(
                      (v, h) => html`
                        <span
                          key=${h}
                          class="heat-cell"
                          style=${{ "--i": v / max }}
                          title=${`${day} ${String(h).padStart(2, "0")}:00 · ${v}m`}
                        />
                      `,
                    )}
                  </div>
                </div>
              `,
            )}
          </div>
          <div class="heat-foot">
            <${HeatLegend} /><span>24h × 7 days</span>
          </div>
        </section>`;
      }

      function Insights({ data }) {
        const icon = html`<svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 3v3M12 18v3M3 12h3M18 12h3M5.5 5.5l2 2M16.5 16.5l2 2M5.5 18.5l2-2M16.5 7.5l2-2"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <circle
            cx="12"
            cy="12"
            r="3"
            stroke="currentColor"
            stroke-width="1.6"
          />
        </svg>`;
        const row = (tag, cls, body, htmlBody = false) => html`
          <div class="insight-item">
            <span class=${`insight-tag ${cls || ""}`}>${tag}</span>
            <p
              dangerouslySetInnerHTML=${htmlBody ? { __html: body } : undefined}
            >
              ${htmlBody ? null : body}
            </p>
          </div>
        `;

        if (data.aiRecap)
          return html`<section class="card">
            <div class="insights-head">
              <div class="insights-icon">${icon}</div>
              <div class="card-title">AI recap</div>
              <span class="chip" style=${{ marginLeft: "auto" }}>recap</span>
            </div>
            ${row("summary", "good", data.aiRecap)}
          </section>`;

        if (data.aiPerBlock > 0)
          return html`<section class="card">
            <div class="insights-head">
              <div class="insights-icon">${icon}</div>
              <div class="card-title">AI insights</div>
              <span class="chip" style=${{ marginLeft: "auto" }}
                >${data.aiPerBlock}
                block${data.aiPerBlock === 1 ? "" : "s"}</span
              >
            </div>
            ${row(
              "inline",
              "",
              "Per-block AI summaries are inline in the timeline. Run <code>fw dashboard --ai-recap</code> for an aggregate.",
              true,
            )}
          </section>`;

        return html`<section class="card">
          <div class="insights-head">
            <div class="insights-icon">${icon}</div>
            <div class="card-title">AI insights</div>
          </div>
          ${row(
            "setup",
            "",
            "Set <code>ai_enabled: true</code> and <code>ai_command</code> in your config to see AI insights here.",
            true,
          )}
        </section>`;
      }

      function Donut({ title, subtitle, items, valueKey = "min" }) {
        const [hover, setHover] = useState(null);

        const { segs, total } = useMemo(() => {
          const t = items.reduce((n, x) => n + (x[valueKey] || 0), 0);
          let acc = -Math.PI / 2;
          const s = items.map((item) => {
            const v = item[valueKey] || 0;
            const frac = t ? v / t : 0;
            const start = acc;
            const end = acc + frac * Math.PI * 2;
            acc = end;
            return { ...item, v, frac, s: start, e: end };
          });
          return { segs: s, total: t };
        }, [items, valueKey]);

        const active = hover == null ? null : segs[hover];

        return html`<section class="card">
          <div class="card-head">
            <div class="card-title">${title}</div>
            ${subtitle && html`<div class="card-sub">${subtitle}</div>`}
          </div>
          ${!items.length
            ? html`<div>No data</div>`
            : html`
                <div class="donut-wrap">
                  <svg class="donut" viewBox="0 0 220 220">
                    ${segs.map(
                      (seg, i) => html`
                        <path
                          key=${seg.name}
                          d=${arcPath(110, 110, 86, 56, seg.s, seg.e)}
                          fill=${seg.color}
                          style=${{
                            cursor: "default",
                            opacity: hover == null || hover === i ? 1 : 0.35,
                            transition: "opacity 0.2s",
                          }}
                          onMouseEnter=${() => setHover(i)}
                          onMouseLeave=${() => setHover(null)}
                        />
                      `,
                    )}
                    <circle
                      cx="110"
                      cy="110"
                      r="55"
                      fill="none"
                      stroke="var(--hairline-soft)"
                      stroke-width="1"
                    />
                    <circle
                      cx="110"
                      cy="110"
                      r="87"
                      fill="none"
                      stroke="var(--hairline-soft)"
                      stroke-width="1"
                    />
                  </svg>
                  <div class="donut-center">
                    ${active
                      ? html`
                          <div class="donut-pct font-display tnum">
                            ${Math.round(active.frac * 100)}%
                          </div>
                          <div class="donut-name">${active.name}</div>
                          <div class="donut-val tnum">${active.v}m</div>
                        `
                      : html`
                          <div class="donut-total font-display tnum">
                            ${fmtHM(total)}
                          </div>
                          <div class="donut-cap eyebrow">total</div>
                        `}
                  </div>
                </div>
                <ul class="legend">
                  ${segs.map(
                    (seg, i) => html`
                      <li
                        key=${seg.name}
                        class=${`legend-row ${hover === i ? "is-hover" : ""}`}
                        onMouseEnter=${() => setHover(i)}
                        onMouseLeave=${() => setHover(null)}
                      >
                        <span
                          class="legend-swatch"
                          style=${{ background: seg.color }}
                        />
                        <span class="legend-name">${seg.name}</span>
                        <span class="legend-val tnum">${seg.v}m</span>
                        <span class="legend-pct tnum"
                          >${Math.round(seg.frac * 100)}%</span
                        >
                      </li>
                    `,
                  )}
                </ul>
              `}
        </section>`;
      }

      function Languages({ data }) {
        const { langs, top, total } = useMemo(() => {
          const l = data.byLanguage.slice(0, 8);
          return {
            langs: l,
            top: l[0]?.min || 1,
            total: l.reduce((n, item) => n + item.min, 0),
          };
        }, [data.byLanguage]);

        return html`<section class="card">
          <div class="card-head">
            <div class="card-title">Languages</div>
            <div class="card-sub">by time in session</div>
          </div>
          ${!langs.length
            ? html`<p>No language data — inferred from git diffs.</p>`
            : html`
                <div class="lang-bar">
                  ${langs.map(
                    (l) =>
                      html`<span
                        key=${l.name}
                        class="lang-seg"
                        style=${{ flex: l.min, background: l.color }}
                        title=${`${l.name} · ${l.min}m`}
                      />`,
                  )}
                </div>
                <ul class="lang-list">
                  ${langs.map(
                    (l) => html`
                      <li key=${l.name}>
                        <span
                          class="legend-swatch"
                          style=${{ background: l.color }}
                        />
                        <span class="lang-name">${l.name}</span>
                        <div class="lang-bar-mini">
                          <span
                            style=${{
                              width: `${(l.min / top) * 100}%`,
                              background: l.color,
                            }}
                          />
                        </div>
                        <span class="tnum lang-val">${l.min}m</span>
                      </li>
                    `,
                  )}
                </ul>
                <div class="lang-foot">
                  <span class="eyebrow">total</span
                  ><span class="tnum lang-total font-display"
                    >${fmtHM(total)} <span class="dim">tracked</span></span
                  >
                </div>
              `}
        </section>`;
      }

      function HourPattern({ data }) {
        const { max, peak, first, last } = useMemo(
          () => ({
            max: Math.max(1, ...data.hourly),
            peak: data.hourly.indexOf(Math.max(...data.hourly)),
            first: data.hourly.findIndex((v) => v > 0),
            last: data.hourly.reduce((a, v, i) => (v > 0 ? i : a), -1),
          }),
          [data.hourly],
        );

        const stat = (k, v) =>
          html`<div key=${k}>
            <span class="eyebrow">${k}</span><span class="tnum">${v}</span>
          </div>`;

        return html`<section class="card">
          <div class="card-head">
            <div class="card-title">Best hours</div>
            <div class="card-sub">focus by hour of day</div>
          </div>
          <div class="hour-bars">
            ${data.hourly.map(
              (v, i) => html`
                <div key=${i} class="hour-bar">
                  <span
                    class="hour-fill"
                    style=${{ "--h": `${(v / max) * 100}%` }}
                  />
                  ${i % 4 === 0 &&
                  html`<span class="hour-tick">${fmtHour(i)}</span>`}
                </div>
              `,
            )}
          </div>
          <div class="hour-stats">
            ${stat("peak", fmtHour(peak))}
            ${first >= 0 && stat("start", fmtHour(first))}
            ${last >= 0 && stat("end", fmtHour(last))}
          </div>
        </section>`;
      }

      function StreakCard({ data }) {
        const s = data.streakDays;
        const sub =
          s === 0
            ? "start coding today"
            : s >= 14
              ? "on fire 🔥"
              : s >= 7
                ? "keep it up 🌿"
                : "building momentum";

        return html`<section class="card">
          <div class="card-head">
            <div class="card-title">Streak</div>
            <div class="card-sub">last 30 days</div>
          </div>
          <div class="streak-hero">
            <span class="streak-big font-display tnum">${s}</span>
            <div class="streak-hero-right">
              <span class="streak-hero-label">day streak</span
              ><span class="streak-hero-sub eyebrow">${sub}</span>
            </div>
          </div>
          <div class="streak-grid">
            ${data.streakCells.map((cell) => {
              const i = cell.v / 4;
              return html`<span
                key=${cell.d}
                class="streak-pad"
                title=${cell.d === 29 ? "today" : `${29 - cell.d}d ago`}
                style=${{
                  background: `color-mix(in oklch, var(--moss) ${i * 85}%, var(--bg-inset))`,
                  border: `1px solid color-mix(in oklch, var(--moss) ${i * 40}%, var(--hairline-soft))`,
                  outline:
                    cell.d === 29
                      ? "2px solid color-mix(in oklch, var(--moss) 70%, transparent)"
                      : "",
                  boxShadow:
                    i > 0.15
                      ? `inset 0 1px 0 rgba(255,255,255,${(i * 0.12).toFixed(2)}), 0 0 ${(5 + i * 9).toFixed(1)}px ${(i * 2.5).toFixed(1)}px color-mix(in oklch, var(--moss) ${Math.round(i * 55)}%, transparent)`
                      : "",
                }}
              />`;
            })}
          </div>
          <div class="streak-axis"><span>30d ago</span><span>today</span></div>
        </section>`;
      }

      function ProjectBreakdown({ data }) {
        const top = data.byProject[0]?.min || 1;
        return html`<section class="card">
          <div class="card-head">
            <div class="card-title">By project</div>
            <div class="card-sub">time breakdown</div>
          </div>
          <ul class="lang-list" style=${{ gap: "12px" }}>
            ${data.byProject.slice(0, 8).map(
              (p) => html`
                <li
                  key=${p.name}
                  style=${{ gridTemplateColumns: "10px 1fr 1fr auto" }}
                >
                  <span
                    class="legend-swatch"
                    style=${{ background: p.color }}
                  />
                  <span class="lang-name">${p.name}</span>
                  <div class="lang-bar-mini">
                    <span
                      style=${{
                        width: `${(p.min / top) * 100}%`,
                        background: p.color,
                      }}
                    />
                  </div>
                  <span class="tnum lang-val">${p.min}m</span>
                </li>
              `,
            )}
          </ul>
        </section>`;
      }

      function Timeline({ data }) {
        const { entries, max } = useMemo(() => {
          const e = [...data.timeline].reverse();
          return {
            entries: e,
            max: Math.max(1, ...e.map((entry) => entry.focus)),
          };
        }, [data.timeline]);

        return html`<section class="card">
          <div class="card-head">
            <div class="card-title">Timeline</div>
            <div class="card-sub">focus blocks · newest first</div>
          </div>
          ${!entries.length
            ? html`<p>No blocks recorded yet.</p>`
            : html`
                <div class="timeline-scroll">
                  <ol class="timeline">
                    ${entries.map(
                      (e, i) => html`
                        <li
                          key=${i}
                          class=${`tl-row ${!e.project ? "tl-idle" : ""}`}
                        >
                          <div class="tl-time tnum">${e.from} → ${e.to}</div>
                          <div class="tl-rail">
                            <span
                              class="tl-dot"
                              style=${{
                                "--c": e.project
                                  ? "var(--accent)"
                                  : "var(--ink-5)",
                              }}
                            />
                            ${i < entries.length - 1 &&
                            html`<span class="tl-line" />`}
                          </div>
                          <div class="tl-body">
                            ${!e.project
                              ? html`
                                  <div class="tl-head">
                                    <span class="dim">— idle</span>
                                  </div>
                                `
                              : html`
                                  <div class="tl-head">
                                    <span class="tl-project">${e.project}</span>
                                    ${e.branch &&
                                    html`<span class="branch-tag"
                                      ><${BranchIcon} size=${10} />
                                      ${e.branch}</span
                                    >`}
                                  </div>
                                  <div class="tl-meta">
                                    <span class="tnum">${e.focus}m</span> focus
                                    ${e.switches > 0 &&
                                    html`<span class="dim"> · </span
                                      ><span class="tnum">${e.switches}</span>
                                      context switches`}
                                  </div>
                                  <div class="tl-bar">
                                    <span
                                      style=${{
                                        width: `${(e.focus / max) * 100}%`,
                                      }}
                                    />
                                  </div>
                                  ${e.ai &&
                                  html`<div class="tl-ai">${e.ai}</div>`}
                                `}
                          </div>
                        </li>
                      `,
                    )}
                  </ol>
                </div>
              `}
        </section>`;
      }

      function Summary({ data }) {
        const top3 = (arr) =>
          arr
            .slice(0, 3)
            .map((x) => `${x.name} ${x.min}m`)
            .join(" · ") || "—";
        const row = (term, value) =>
          html`<div key=${term}>
            <dt>${term}</dt>
            <dd>${value}</dd>
          </div>`;

        return html`<section class="card">
          <div class="card-head">
            <div class="card-title">Summary</div>
            <div class="card-sub">${data.period} · narrative</div>
          </div>
          <div class="summary-scroll">
            <dl class="summary-list">
              ${row(
                "Focus",
                html`<b class="tnum">${data.focus.totalMin}m</b> across
                  <b class="tnum">${data.focus.blocks}</b> blocks`,
              )}
              ${data.byProject.length > 0 &&
              row("Projects", top3(data.byProject))}
              ${data.byCommand.length > 0 && row("Tools", top3(data.byCommand))}
              ${row(
                "Code",
                html`<span class="tnum">${data.code.files} files</span> (<span
                    class="tnum diff-add"
                    >+${data.code.added}</span
                  >
                  <span class="tnum diff-rm">−${data.code.removed}</span>)`,
              )}
              ${data.topRepo.name &&
              data.topRepo.name !== "—" &&
              row(
                "Top repo",
                html`<code>${data.topRepo.name}</code>${data.topRepo.branch &&
                  html` on <code>${data.topRepo.branch}</code>`}`,
              )}
            </dl>
          </div>
        </section>`;
      }

      function WeekBars({ data }) {
        const max = useMemo(
          () => Math.max(1, ...data.weekDays.map((d) => d.min)),
          [data.weekDays],
        );
        return html`<section class="card">
          <div class="card-head">
            <div class="card-title">Week at a glance</div>
            <div class="card-sub">focus per day</div>
          </div>
          <div class="week-bars">
            ${data.weekDays.map(
              (d) => html`
                <div key=${d.day} class="week-bar">
                  <div class="week-track">
                    <span
                      class="week-fill"
                      style=${{ "--h": `${(d.min / max) * 100}%` }}
                    >
                      ${d.min > 0 &&
                      html`<span class="week-fill-val tnum"
                        >${fmtHM(d.min)}</span
                      >`}
                    </span>
                  </div>
                  <div class="week-label">
                    <div class="week-day">${d.day}</div>
                    <div class="week-date tnum">${d.date}</div>
                  </div>
                </div>
              `,
            )}
          </div>
        </section>`;
      }

      function TodayView({ data }) {
        return html`<main class="dashboard">
          <${HeroStrip} data=${data} label="today" />
          <div class="grid-act">
            <${ActivityHeatmap} data=${data} /><${Insights} data=${data} />
          </div>
          <div class="grid-3">
            <${Donut}
              title="By project"
              subtitle="today"
              items=${data.byProject}
            />
            <${Donut}
              title="By command"
              subtitle="today · top tools"
              items=${data.byCommand.slice(0, 8)}
            />
            <${Languages} data=${data} />
          </div>
          <div class="grid-mid">
            <${HourPattern} data=${data} />
            <${StreakCard} data=${data} />
            <${ProjectBreakdown} data=${data} />
          </div>
          <div class="grid-bot">
            <${Timeline} data=${data} /><${Summary} data=${data} />
          </div>
        </main>`;
      }

      function WeekView({ data }) {
        return html`<main class="dashboard">
          <${HeroStrip} data=${data} label="this week" />
          ${data.weekDays.length ? html`<${WeekBars} data=${data} />` : null}
          <${WeekHeatmap} data=${data} />
          <div class="grid-3">
            <${Donut}
              title="By project"
              subtitle="this week"
              items=${data.byProject}
            />
            <${Donut}
              title="By command"
              subtitle="this week"
              items=${data.byCommand.slice(0, 8)}
            />
            <${Languages} data=${data} />
          </div>
          <div class="grid-bot">
            <${Timeline} data=${data} /><${Summary} data=${data} />
          </div>
        </main>`;
      }

      function EmptyState() {
        return html`<main class="dashboard">
          <div class="card empty-state">
            <${FlowMark} size=${48} />
            <h2>No activity yet</h2>
            <p>Start the daemon to begin tracking.</p>
            <p><code>fw start</code></p>
          </div>
        </main>`;
      }

      function WrongPeriod({ data, view }) {
        return html`<main class="dashboard">
          <div class="card empty-state">
            <h2>${view[0].toUpperCase() + view.slice(1)} view</h2>
            <p>This dashboard was generated for the ${data.period} period.</p>
            <p><code>fw dashboard ${view}</code></p>
          </div>
        </main>`;
      }

      function App() {
        const data = useMemo(() => transform(window.__RAW || {}), []);
        const [view, setView] = useState(data.period);
        const [theme, setTheme] = useState(
          localStorage.getItem("fw-theme") || "system",
        );

        useEffect(() => {
          const apply = () => {
            document.documentElement.dataset.theme = resolvedTheme(theme);
            localStorage.setItem("fw-theme", theme);
          };
          apply();
          const mq = matchMedia("(prefers-color-scheme: dark)");
          mq.addEventListener?.("change", apply);
          return () => mq.removeEventListener?.("change", apply);
        }, [theme]);

        const cycleTheme = useCallback(() => {
          setTheme((t) => THEMES[(THEMES.indexOf(t) + 1) % THEMES.length]);
        }, []);

        return html`<div class="page">
          <${Header}
            data=${data}
            view=${view}
            setView=${setView}
            theme=${theme}
            cycleTheme=${cycleTheme}
          />
          ${!data.hasData
            ? html`<${EmptyState} />`
            : view === data.period
              ? view === "week"
                ? html`<${WeekView} data=${data} />`
                : html`<${TodayView} data=${data} />`
              : html`<${WrongPeriod} data=${data} view=${view} />`}
          <footer class="foot">
            flowd<span class="dim">
              — local activity tracker · self-hosted</span
            >
          </footer>
        </div>`;
      }
      render(html`<${App} />`, document.getElementById("app"));
    </script>
  </body>
</html>
