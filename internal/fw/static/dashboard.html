<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>flowd — dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="theme.css"/>
<link rel="stylesheet" href="base.css"/>
<!-- Apply theme before render to prevent flash -->
<script>
(function(){
  var stored = localStorage.getItem('fw-theme') || 'system';
  var resolved = stored === 'system'
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : stored;
  document.documentElement.setAttribute('data-theme', resolved);
  document.documentElement.setAttribute('data-stored-theme', stored);
})();
</script>
</head>
<body>
<div id="app"></div>

<script>const __RAW = __FLOWD_DATA__;</script>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';

function el(tag, cls, children) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  append(e, children);
  return e;
}
function svg(tag, attrs) {
  const e = document.createElementNS(SVG_NS, tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
  return e;
}
function append(parent, children) {
  if (children == null) return;
  if (typeof children === 'string' || typeof children === 'number') {
    parent.appendChild(document.createTextNode(String(children)));
  } else if (Array.isArray(children)) {
    children.forEach(c => c != null && parent.appendChild(
      typeof c === 'string' || typeof c === 'number'
        ? document.createTextNode(String(c))
        : c
    ));
  } else {
    parent.appendChild(children);
  }
}
function t(text) { return document.createTextNode(String(text ?? '')); }

function fmtHM(m) {
  const h = Math.floor(m/60), mm = m%60;
  return h===0 ? `${mm}m` : mm===0 ? `${h}h` : `${h}h ${mm}m`;
}

const PALETTE = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)',
                 'var(--c5)','var(--c6)','var(--c7)','var(--c8)'];

// ─────────────────────────────────────────────────────────────
// Data transform
// ─────────────────────────────────────────────────────────────
function objToArr(obj, vk='min') {
  return Object.entries(obj||{})
    .filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])
    .map(([name,value],i)=>({name, [vk]:value, color:PALETTE[i%PALETTE.length]}));
}
function computeHourly(heatmap) {
  const h = new Array(24).fill(0);
  (heatmap||[]).forEach(c=>{ const i=Math.floor(c.hour/2); if(i>=0&&i<24) h[i]+=c.minute; });
  return h;
}
function computeWeekHourly(heatmap) {
  const byDay={};
  (heatmap||[]).forEach(c=>{
    if(!byDay[c.day]) byDay[c.day]=new Array(24).fill(0);
    if(c.hour>=0&&c.hour<24) byDay[c.day][c.hour]+=c.minute;
  });
  return byDay;
}
function computeWeekDays(heatmap) {
  const byDay={};
  (heatmap||[]).forEach(c=>{ if(!byDay[c.day]) byDay[c.day]=0; byDay[c.day]+=c.minute; });
  return Object.entries(byDay).map(([lbl,min])=>{
    const [day,date]=(lbl+' ').split(' '); return {day,date,min};
  });
}
function makeStreakCells(streakDays) {
  return Array.from({length:30},(_,i)=>{
    const ago=29-i;
    if(ago<streakDays){
      const v=ago===0?4:Math.min(4,((i*7+3)%3)+2);
      return {d:i,v};
    }
    return {d:i, v:(ago<streakDays+8&&(i*13)%4===0)?1:0};
  });
}

const RAW  = __RAW;
const isToday = RAW.period==='today';

const byProject  = objToArr(RAW.by_project);
const byCommand  = objToArr(RAW.by_tool);
const byLanguage = objToArr(RAW.languages,'min');
const hourly     = isToday ? computeHourly(RAW.heatmap)
                           : (()=>{ const h=new Array(24).fill(0); (RAW.heatmap||[]).forEach(c=>{if(c.hour>=0&&c.hour<24)h[c.hour]+=c.minute;}); return h; })();
const weekDays        = computeWeekDays(RAW.heatmap);
const weekHourlyByDay = computeWeekHourly(RAW.heatmap);
const streakCells     = makeStreakCells(RAW.streak_days||0);

const DATA = {
  period:     RAW.period||'today',
  generated:  RAW.generated||'',
  machine:    RAW.machine||'—',
  os:         RAW.os||'',
  topRepo:    {name:RAW.top_repo||'—', branch:RAW.top_branch||''},
  focus:      {totalMin:RAW.total_focus_min||0, blocks:RAW.total_blocks||0, switches:RAW.total_switches||0},
  code:       {files:RAW.files_changed||0, added:RAW.lines_added||0, removed:RAW.lines_removed||0},
  byProject, byCommand, byLanguage,
  hourly, weekDays, weekHourlyByDay,
  streakCells, streakDays:RAW.streak_days||0,
  timeline:(RAW.timeline||[]).map(t=>({
    from:t.start, to:t.end, project:t.repo||null,
    branch:t.branch||null, focus:t.focus, switches:t.switches,
    ai:t.ai||null, intensity:Math.min(1,(t.focus||0)/30)
  })),
  aiRecap:    RAW.ai_recap||null,
  aiPerBlock: RAW.ai_per_block||0,
  hasData:    (RAW.total_blocks||0)>0,
};

// ─────────────────────────────────────────────────────────────
// Theme  (dark / light / system)
// ─────────────────────────────────────────────────────────────
const THEMES = ['dark','light','system'];
const THEME_ICONS = {
  dark:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  light:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  system: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
};

let storedTheme = localStorage.getItem('fw-theme') || 'system';

function applyTheme(t) {
  storedTheme = t;
  localStorage.setItem('fw-theme', t);
  const resolved = t==='system'
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : t;
  document.documentElement.setAttribute('data-theme', resolved);
  const btn = document.getElementById('theme-btn');
  if (btn) { btn.innerHTML = THEME_ICONS[t]; btn.title = `Theme: ${t}`; }
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
  if (storedTheme==='system') applyTheme('system');
});

// ─────────────────────────────────────────────────────────────
// SVG helpers
// ─────────────────────────────────────────────────────────────
function arcPath(cx,cy,rO,rI,a0,a1) {
  const large = a1-a0>Math.PI?1:0;
  const pt=(r,a)=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
  const [x0,y0]=pt(rO,a0),[x1,y1]=pt(rO,a1);
  const [xi0,yi0]=pt(rI,a1),[xi1,yi1]=pt(rI,a0);
  return `M${x0} ${y0} A${rO} ${rO} 0 ${large} 1 ${x1} ${y1} L${xi0} ${yi0} A${rI} ${rI} 0 ${large} 0 ${xi1} ${yi1}Z`;
}

function buildSparkline(data) {
  const W=220,H=26, max=Math.max(...data,1), step=W/(data.length-1);
  const pts=data.map((v,i)=>`${i*step},${H-(v/max)*H}`);
  const path=`M ${pts.join(' L ')}`;
  const area=`${path} L ${W},${H} L 0,${H} Z`;
  const s=svg('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none',class:'sparkline'});
  const defs=svg('defs');
  const grad=svg('linearGradient',{id:'sp',x1:'0',x2:'0',y1:'0',y2:'1'});
  const s1=svg('stop',{offset:'0','stop-color':'var(--accent)','stop-opacity':'0.4'});
  const s2=svg('stop',{offset:'1','stop-color':'var(--accent)','stop-opacity':'0'});
  grad.append(s1,s2); defs.appendChild(grad); s.appendChild(defs);
  const a=svg('path',{d:area,fill:'url(#sp)'});
  const l=svg('path',{d:path,stroke:'var(--accent)','stroke-width':'1.6',fill:'none','stroke-linecap':'round','stroke-linejoin':'round'});
  s.append(a,l);
  return s;
}

function buildFlowMark(size=40) {
  const s=svg('svg',{width:size,height:size,viewBox:'0 0 40 40','aria-hidden':'true'});
  const defs=svg('defs');
  const g=svg('linearGradient',{id:'fmg',x1:'0',y1:'0',x2:'1',y2:'1'});
  const gs1=svg('stop',{offset:'0','stop-color':'var(--moss)'});
  const gs2=svg('stop',{offset:'1','stop-color':'var(--amber)'});
  g.append(gs1,gs2); defs.appendChild(g); s.appendChild(defs);
  const r1=svg('rect',{x:'1',y:'1',width:'38',height:'38',rx:'11',fill:'url(#fmg)',opacity:'.18'});
  const r2=svg('rect',{x:'1',y:'1',width:'38',height:'38',rx:'11',fill:'none',stroke:'url(#fmg)','stroke-width':'1.3'});
  const p=svg('path',{d:'M11 28c4-1 7-4 8-8 1-4 4-7 9-8',stroke:'var(--moss)','stroke-width':'2',fill:'none','stroke-linecap':'round'});
  const c=svg('circle',{cx:'28',cy:'12',r:'2.2',fill:'var(--amber)'});
  s.append(r1,r2,p,c);
  return s;
}

function branchIcon(size=11) {
  const s=svg('svg',{width:size,height:size,viewBox:'0 0 16 16',fill:'none'});
  s.innerHTML='<path d="M5 3v10M11 3a2 2 0 1 0-2 2v3c0 1.5-1.5 2-3 2-1 0-1.5.3-2 1" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="3" r="1.5" stroke="currentColor" stroke-width="1.4"/>';
  return s;
}

// ─────────────────────────────────────────────────────────────
// Header
// ─────────────────────────────────────────────────────────────
function buildHeader(view, onViewChange) {
  const hdr = el('header','header');

  const brand = el('div','brand');
  const brandText = el('div');
  const brandName = el('div','brand-name font-display','flowd');
  const brandSub  = el('div','brand-sub');
  const stamp = el('span','brand-stamp tnum', DATA.generated);
  brandSub.append(el('span','eyebrow','Generated'), t(' '), stamp);
  if (DATA.hasData) {
    const dot = el('span','brand-dot',' · ');
    const chip = el('span','chip');
    chip.append(el('span','status-dot'), t(' '+DATA.period));
    brandSub.append(dot, chip);
  }
  brandText.append(brandName, brandSub);
  brand.append(buildFlowMark(40), brandText);

  const right = el('div','header-right');

  // Tab seg
  const seg = el('div','seg');
  ['Today','Week'].forEach(v => {
    const b = el('button','seg-btn'+(view===v.toLowerCase()?' is-active':''), v);
    b.addEventListener('click', () => onViewChange(v.toLowerCase()));
    if (v.toLowerCase()!==DATA.period) {
      b.title = `Run \`fw dashboard ${v.toLowerCase()}\` to generate ${v.toLowerCase()} data`;
    }
    seg.appendChild(b);
  });

  // Theme btn
  const themeBtn = el('button','icon-btn');
  themeBtn.id = 'theme-btn';
  themeBtn.innerHTML = THEME_ICONS[storedTheme];
  themeBtn.title = `Theme: ${storedTheme}`;
  themeBtn.addEventListener('click', ()=>{
    const next = THEMES[(THEMES.indexOf(storedTheme)+1)%THEMES.length];
    applyTheme(next);
  });

  right.append(seg, themeBtn);
  hdr.append(brand, right);
  return hdr;
}

// ─────────────────────────────────────────────────────────────
// Hero strip
// ─────────────────────────────────────────────────────────────
function buildHeroStrip(periodLabel) {
  const strip = el('div','hero-strip');
  const f=DATA.focus, c=DATA.code, r=DATA.topRepo;

  // Focus card
  const fc = el('div','hero-card hero-primary card');
  const eyebrow = el('div','eyebrow',`Focus ${periodLabel}`);
  const num = el('div','hero-num font-display tnum');
  num.append(t(Math.floor(f.totalMin/60)), el('span','hero-unit','h'),
             t(f.totalMin%60),             el('span','hero-unit','m'));
  const sub = el('div','hero-sub');
  sub.append(el('span','tnum',f.blocks), t(' focus blocks'),
             el('span','dim',' · '), el('span','tnum',f.switches), t(' context switches'));
  fc.append(eyebrow, num, sub, buildSparkline(DATA.hourly));
  strip.appendChild(fc);

  // Machine
  const mc = el('div','hero-card card');
  mc.append(el('div','eyebrow','Machine'),
            el('div','hero-mid font-display',DATA.machine),
            el('div','hero-sub',DATA.os));
  const bar = el('div','machine-bar'); bar.appendChild(el('span',null,null)); bar.children[0].style.width='50%';
  mc.appendChild(bar);
  strip.appendChild(mc);

  // Top repo
  const rc = el('div','hero-card card');
  rc.append(el('div','eyebrow','Top repo'),
            el('div','hero-mid font-display',r.name));
  if (r.branch) {
    const bt = el('span','branch-tag');
    bt.append(branchIcon(), t(' '+r.branch));
    const rsub = el('div','hero-sub'); rsub.appendChild(bt);
    rc.appendChild(rsub);
  }
  if (DATA.byProject[0]) rc.appendChild(el('div','hero-mini tnum',`${DATA.byProject[0].name} · ${DATA.byProject[0].min}m`));
  strip.appendChild(rc);

  // Code
  const cc = el('div','hero-card card');
  const csub = el('div','hero-sub');
  csub.append(el('span','tnum diff-add',`+${c.added}`),
              el('span','dim',' / '),
              el('span','tnum diff-rm',`−${c.removed}`));
  cc.append(el('div','eyebrow','Code'),
            el('div','hero-mid font-display tnum',`${c.files} files`),
            csub);
  strip.appendChild(cc);
  return strip;
}

// ─────────────────────────────────────────────────────────────
// Activity heatmap — today (60 cells)
// ─────────────────────────────────────────────────────────────
function buildHeatmap() {
  const card = el('div','card heatmap-card');
  const head = el('div','card-head');
  head.append(el('div','card-title','Activity heatmap'),
              el('div','card-sub','today · focus blocks by start time'));
  card.appendChild(head);

  const axis = el('div','heat-axis');
  ['8a','10a','12p','2p','4p','6p','8p'].forEach(l=>axis.appendChild(el('span',null,l)));
  card.appendChild(axis);

  const cells = el('div','heat-cells');
  let peakI=0, peakHour=8;
  for (let i=0;i<60;i++) {
    const rawHour = 8+Math.floor(i*12/60);
    const v = DATA.hourly[Math.min(23,rawHour)]||0;
    const noise = ((i*13)%7)/6;
    const intensity = Math.max(0, Math.min(1, (v/45)*(0.5+noise*0.6)));
    if (intensity > (peakI||0)) { peakI=intensity; peakHour=rawHour; }
    const c = el('span','heat-cell');
    c.style.setProperty('--i',intensity);
    c.title = `~${rawHour}:00 — ≈${Math.round(intensity*30)}m`;
    cells.appendChild(c);
  }
  card.appendChild(cells);

  const foot = el('div','heat-foot');
  const legend = el('span','heat-legend');
  legend.appendChild(t('less '));
  [0.05,0.3,0.55,0.8,1].forEach(v=>{
    const c=el('span','heat-cell'); c.style.setProperty('--i',v); legend.appendChild(c);
  });
  legend.appendChild(t(' more'));
  foot.append(legend, el('span','heat-peak',peakI>0?`peak ~${peakHour}:00`:''));
  card.appendChild(foot);
  return card;
}

// ─────────────────────────────────────────────────────────────
// Week heatmap
// ─────────────────────────────────────────────────────────────
function buildWeekHeatmap() {
  const card = el('div','card heatmap-card');
  const head = el('div','card-head');
  head.append(el('div','card-title','Activity heatmap'),
              el('div','card-sub','last 7 days × hour of day'));
  card.appendChild(head);

  const days = Object.entries(DATA.weekHourlyByDay);
  const maxV = Math.max(1,...days.flatMap(([,hrs])=>hrs));
  const grid = el('div','week-heat-grid');
  days.forEach(([day,hrs])=>{
    const row=el('div','week-heat-row');
    row.appendChild(el('span','week-heat-lbl',day));
    const cells=el('div','week-heat-cells');
    hrs.forEach((v,h)=>{
      const c=el('span','heat-cell'); c.style.setProperty('--i',v/maxV);
      c.title=`${day} ${String(h).padStart(2,'0')}:00 · ${v}m`;
      cells.appendChild(c);
    });
    row.appendChild(cells); grid.appendChild(row);
  });
  card.appendChild(grid);

  const foot=el('div','heat-foot');
  const legend=el('span','heat-legend');
  legend.appendChild(t('less '));
  [0.05,0.3,0.55,0.8,1].forEach(v=>{
    const c=el('span','heat-cell'); c.style.setProperty('--i',v); legend.appendChild(c);
  });
  legend.appendChild(t(' more'));
  foot.append(legend, el('span',null,'24h × 7 days'));
  card.appendChild(foot);
  return card;
}

// ─────────────────────────────────────────────────────────────
// AI Insights
// ─────────────────────────────────────────────────────────────
function buildInsights() {
  const card = el('div','card insights-card');
  const head = el('div','insights-head');
  const icon = el('div','insights-icon');
  icon.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.5 5.5l2 2M16.5 16.5l2 2M5.5 18.5l2-2M16.5 7.5l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>';
  head.append(icon, el('div','card-title','AI insights'));

  if (DATA.aiRecap) {
    const chip = el('span','chip'); chip.style.marginLeft='auto'; chip.textContent='recap';
    head.appendChild(chip); card.appendChild(head);
    const item = el('div','insight-item');
    item.append(el('span','insight-tag good','summary'), el('p',null,DATA.aiRecap));
    card.appendChild(item);
  } else if (DATA.aiPerBlock>0) {
    const chip = el('span','chip'); chip.style.marginLeft='auto';
    chip.textContent=`${DATA.aiPerBlock} block${DATA.aiPerBlock===1?'':'s'}`;
    head.appendChild(chip); card.appendChild(head);
    const item=el('div','insight-item');
    const p=el('p'); p.innerHTML='Per-block AI summaries are inline in the timeline. Run <code>fw dashboard --ai-recap</code> for an aggregate.';
    item.append(el('span','insight-tag','inline'),p);
    card.appendChild(item);
  } else {
    card.appendChild(head);
    const item=el('div','insight-item');
    const p=el('p'); p.innerHTML='Set <code>ai_enabled: true</code> and <code>ai_command</code> in your config to see AI insights. Run <code>fw dashboard --ai-recap</code> for a session recap.';
    item.append(el('span','insight-tag','setup'),p);
    card.appendChild(item);
  }
  return card;
}

// ─────────────────────────────────────────────────────────────
// Donut chart
// ─────────────────────────────────────────────────────────────
function buildDonut(title, subtitle, items, vk='min') {
  const card = el('div','card donut-card');
  const head = el('div','card-head');
  head.append(el('div','card-title',title));
  if (subtitle) head.append(el('div','card-sub',subtitle));
  card.appendChild(head);

  if (!items.length) {
    card.appendChild(el('div',null,'No data'));
    return card;
  }

  const total = items.reduce((a,b)=>a+(b[vk]||0),0);
  const W=220,H=220,cx=110,cy=110,rO=86,rI=56;
  let acc=-Math.PI/2;
  const segs = items.map(it=>{
    const v=it[vk]||0, frac=total?v/total:0;
    const s=acc, e=acc+frac*Math.PI*2; acc=e;
    return {...it,v,frac,s,e};
  });

  const wrap = el('div','donut-wrap');
  const s = svg('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:'100%',class:'donut'});

  const paths = segs.map(seg=>{
    const p=svg('path',{d:arcPath(cx,cy,rO,rI,seg.s,seg.e),fill:seg.color});
    p.style.cursor='default';
    s.appendChild(p);
    return p;
  });
  s.appendChild(svg('circle',{cx,cy,r:rI-1,fill:'none',stroke:'var(--hairline-soft)','stroke-width':'1'}));
  s.appendChild(svg('circle',{cx,cy,r:rO+1,fill:'none',stroke:'var(--hairline-soft)','stroke-width':'1'}));

  const center = el('div','donut-center');
  const cTotal = el('div','donut-total font-display tnum', fmtHM(total));
  const cCap   = el('div','donut-cap eyebrow','total');
  const cPct   = el('div','donut-pct font-display tnum');
  const cName  = el('div','donut-name');
  const cVal   = el('div','donut-val tnum');
  center.append(cTotal, cCap, cPct, cName, cVal);
  cPct.style.display='none'; cName.style.display='none'; cVal.style.display='none';

  wrap.append(s, center);
  card.appendChild(wrap);

  // Hover
  paths.forEach((p,i)=>{
    p.addEventListener('mouseenter',()=>{
      paths.forEach((q,j)=>q.style.opacity=j===i?'1':'0.35');
      cTotal.style.display='none'; cCap.style.display='none';
      cPct.style.display=''; cName.style.display=''; cVal.style.display='';
      cPct.textContent=Math.round(segs[i].frac*100)+'%';
      cName.textContent=segs[i].name;
      cVal.textContent=segs[i].v+'m';
    });
    p.addEventListener('mouseleave',()=>{
      paths.forEach(q=>q.style.opacity='1');
      cTotal.style.display=''; cCap.style.display='';
      cPct.style.display='none'; cName.style.display='none'; cVal.style.display='none';
    });
  });

  // Legend
  const leg = el('ul','legend');
  segs.forEach((seg,i)=>{
    const li=el('li','legend-row');
    const sw=el('span','legend-swatch'); sw.style.background=seg.color;
    li.append(sw,
      el('span','legend-name',seg.name),
      el('span','legend-val tnum',seg.v+'m'),
      el('span','legend-pct tnum',Math.round(seg.frac*100)+'%'));
    li.addEventListener('mouseenter',()=>paths[i].dispatchEvent(new MouseEvent('mouseenter')));
    li.addEventListener('mouseleave',()=>paths[i].dispatchEvent(new MouseEvent('mouseleave')));
    leg.appendChild(li);
  });
  card.appendChild(leg);
  return card;
}

// ─────────────────────────────────────────────────────────────
// Languages
// ─────────────────────────────────────────────────────────────
function buildLanguages() {
  const card=el('div','card lang-card');
  const head=el('div','card-head');
  head.append(el('div','card-title','Languages'),
              el('div','card-sub','by time in session'));
  card.appendChild(head);

  const langs=DATA.byLanguage.slice(0,8);
  const total=langs.reduce((a,b)=>a+b.min,0);

  if (!langs.length) {
    card.appendChild(el('div',null,'No language data — inferred from git diffs.'));
    return card;
  }

  const bar=el('div','lang-bar');
  langs.forEach(l=>{ const s=el('span','lang-seg'); s.style.flex=l.min; s.style.background=l.color; s.title=`${l.name} · ${l.min}m`; bar.appendChild(s); });
  card.appendChild(bar);

  const list=el('ul','lang-list');
  langs.forEach(l=>{
    const li=el('li');
    const sw=el('span','legend-swatch'); sw.style.background=l.color;
    const bw=el('div','lang-bar-mini');
    const bf=el('span'); bf.style.width=`${(l.min/Math.max(1,langs[0].min))*100}%`; bf.style.background=l.color;
    bw.appendChild(bf);
    li.append(sw, el('span','lang-name',l.name), bw, el('span','tnum lang-val',l.min+'m'));
    list.appendChild(li);
  });
  card.appendChild(list);

  const foot=el('div','lang-foot');
  foot.append(el('span','eyebrow','total'),
              el('span','tnum lang-total font-display',fmtHM(total)+' '));
  const dim=el('span','dim','tracked'); foot.lastChild.appendChild(dim);
  card.appendChild(foot);
  return card;
}

// ─────────────────────────────────────────────────────────────
// Hour pattern
// ─────────────────────────────────────────────────────────────
function buildHourPattern() {
  const card=el('div','card hour-card');
  const head=el('div','card-head');
  head.append(el('div','card-title','Best hours'),
              el('div','card-sub','focus by hour of day'));
  card.appendChild(head);

  const data=DATA.hourly;
  const max=Math.max(...data,1);
  const peakH=data.indexOf(Math.max(...data));
  const fmtH=h=>h===0?'12a':h<12?`${h}a`:h===12?'12p':`${h-12}p`;

  const bars=el('div','hour-bars');
  data.forEach((v,i)=>{
    const bar=el('div','hour-bar'); bar.style.setProperty('--h',`${(v/max)*100}%`);
    bar.appendChild(el('span','hour-fill'));
    if(i%4===0){ const tick=el('span','hour-tick',fmtH(i)); bar.appendChild(tick); }
    bars.appendChild(bar);
  });
  card.appendChild(bars);

  const first=data.findIndex(v=>v>0), last=data.reduce((a,v,i)=>v>0?i:a,-1);
  const stats=el('div','hour-stats');
  const addStat=(lbl,val)=>{ const d=el('div'); d.append(el('span','eyebrow',lbl),el('span','tnum',val)); stats.appendChild(d); };
  addStat('peak',fmtH(peakH));
  if(first>=0) addStat('start',fmtH(first));
  if(last>=0)  addStat('end',fmtH(last));
  card.appendChild(stats);
  return card;
}

// ─────────────────────────────────────────────────────────────
// Streak — launchpad style (6 × 5 = 30)
// ─────────────────────────────────────────────────────────────
function buildStreak() {
  const card=el('div','card streak-card');
  const head=el('div','card-head');
  head.append(el('div','card-title','Streak'),
              el('div','card-sub','last 30 days'));
  card.appendChild(head);

  const s=DATA.streakDays;
  const hero=el('div','streak-hero');
  const big=el('span','streak-big font-display tnum',s);
  const right=el('div','streak-hero-right');
  right.append(el('span','streak-hero-label','day streak'),
               el('span','streak-hero-sub eyebrow', s===0?'start coding today':s>=14?'on fire 🔥':s>=7?'keep it up 🌿':'building momentum'));
  hero.append(big,right);
  card.appendChild(hero);

  // 6 cols × 5 rows
  const grid=el('div','streak-grid');
  DATA.streakCells.forEach(c=>{
    const intensity=c.v/4;
    const pad=el('span','streak-pad');
    pad.style.background=`color-mix(in oklch, var(--moss) ${intensity*85}%, var(--bg-inset))`;
    pad.style.border=`1px solid color-mix(in oklch, var(--moss) ${intensity*40}%, var(--hairline-soft))`;
    if(intensity>0.15){
      const sz=5+intensity*9, sp=intensity*2.5;
      pad.style.boxShadow=`inset 0 1px 0 rgba(255,255,255,${intensity*.12}), 0 0 ${sz}px ${sp}px color-mix(in oklch, var(--moss) ${intensity*55}%, transparent)`;
    }
    if(c.d===29) pad.style.outline='2px solid var(--moss)';
    pad.title=c.d===29?'today':`${29-c.d}d ago`;
    grid.appendChild(pad);
  });
  card.appendChild(grid);

  const axis=el('div','streak-axis');
  axis.append(el('span',null,'30d ago'),el('span',null,'today'));
  card.appendChild(axis);
  return card;
}

// ─────────────────────────────────────────────────────────────
// Timeline
// ─────────────────────────────────────────────────────────────
function buildTimeline() {
  const card=el('div','card timeline-card');
  const head=el('div','card-head');
  head.append(el('div','card-title','Timeline'),
              el('div','card-sub','focus blocks · newest first'));
  card.appendChild(head);

  const tl=[...DATA.timeline].reverse();
  const maxF=Math.max(1,...tl.map(t=>t.focus));

  if(!tl.length){ card.appendChild(el('div',null,'No blocks recorded yet.')); return card; }

  const scroll=el('div','timeline-scroll');
  const list=el('ol','timeline');
  tl.forEach((t,i)=>{
    const row=el('li','tl-row'+((!t.project)?' tl-idle':''));
    const time=el('div','tl-time tnum',`${t.from} → ${t.to}`);

    const rail=el('div','tl-rail');
    const dot=el('span','tl-dot'); dot.style.setProperty('--c',t.project?'var(--accent)':'var(--ink-5)');
    rail.appendChild(dot);
    if(i<tl.length-1){ rail.appendChild(el('span','tl-line')); }

    const body=el('div','tl-body');
    if(t.project){
      const hd=el('div','tl-head');
      hd.appendChild(el('span','tl-project',t.project));
      if(t.branch){ const bt=el('span','branch-tag tl-branch'); bt.append(branchIcon(10),t(' '+t.branch)); hd.appendChild(bt); }
      body.appendChild(hd);
      const meta=el('div','tl-meta');
      meta.append(el('span','tnum',t.focus+'m'),t(' focus'));
      if(t.switches>0) meta.append(el('span','dim',' · '),el('span','tnum',t.switches),t(' context switches'));
      body.appendChild(meta);
      const barw=el('div','tl-bar');
      const barf=el('span'); barf.style.width=`${(t.focus/maxF)*100}%`;
      barw.appendChild(barf); body.appendChild(barw);
      if(t.ai){ const ai=el('div','tl-ai',t.ai); body.appendChild(ai); }
    } else {
      body.appendChild(el('span','dim','— idle'));
    }
    row.append(time,rail,body); list.appendChild(row);
  });
  scroll.appendChild(list); card.appendChild(scroll);
  return card;
}

// ─────────────────────────────────────────────────────────────
// Summary
// ─────────────────────────────────────────────────────────────
function buildSummary() {
  const card=el('div','card summary-card');
  const head=el('div','card-head');
  head.append(el('div','card-title','Summary'),
              el('div','card-sub',`${DATA.period} · narrative`));
  card.appendChild(head);

  const top3=arr=>arr.slice(0,3).map(x=>`${x.name} ${x.min}m`).join(' · ')||'—';
  const {focus,code,byProject,byCommand,topRepo}=DATA;

  const scroll=el('div','summary-scroll');
  const dl=el('dl','summary-list');
  function row(term,val){
    const d=el('div');
    d.append(el('dt',null,term),el('dd',null,val));
    dl.appendChild(d);
  }
  row('Focus',`${focus.totalMin}m across ${focus.blocks} blocks`);
  if(byProject.length) row('Projects',top3(byProject));
  if(byCommand.length) row('Tools',top3(byCommand));
  row('Code',`${code.files} files (+${code.added} −${code.removed})`);
  if(topRepo.name&&topRepo.name!=='—'){
    const dd=el('dd');
    const c1=el('code',null,topRepo.name); dd.appendChild(c1);
    if(topRepo.branch){ dd.append(t(' on '),el('code',null,topRepo.branch)); }
    const d=el('div'); d.append(el('dt',null,'Top repo'),dd); dl.appendChild(d);
  }
  scroll.appendChild(dl); card.appendChild(scroll);
  return card;
}

// ─────────────────────────────────────────────────────────────
// Week bars
// ─────────────────────────────────────────────────────────────
function buildWeekBars() {
  const card=el('div','card week-card');
  const head=el('div','card-head');
  head.append(el('div','card-title','Week at a glance'),
              el('div','card-sub','focus per day'));
  card.appendChild(head);

  const days=DATA.weekDays;
  const maxM=Math.max(1,...days.map(d=>d.min));
  const bars=el('div','week-bars');
  days.forEach(d=>{
    const col=el('div','week-bar');
    const track=el('div','week-track');
    const fill=el('span','week-fill'); fill.style.setProperty('--h',`${(d.min/maxM)*100}%`);
    if(d.min>0) fill.appendChild(el('span','week-fill-val tnum',fmtHM(d.min)));
    track.appendChild(fill); col.appendChild(track);
    const lbl=el('div','week-label');
    lbl.append(el('div','week-day',d.day),el('div','week-date tnum',d.date));
    col.appendChild(lbl); bars.appendChild(col);
  });
  card.appendChild(bars);
  return card;
}

// ─────────────────────────────────────────────────────────────
// Empty state
// ─────────────────────────────────────────────────────────────
function buildEmpty() {
  const card=el('div','card empty-state');
  card.append(buildFlowMark(48),
              el('h2',null,'No activity yet'),
              el('p',null,'Start the daemon to begin tracking.'),
              el('p',null,el('code',null,'fw start')));
  return card;
}

// ─────────────────────────────────────────────────────────────
// Render today / week
// ─────────────────────────────────────────────────────────────
function renderToday() {
  const main=el('main','dashboard');
  main.append(
    buildHeroStrip('today'),
    (() => { const g=el('div','grid-act'); g.append(buildHeatmap(),buildInsights()); return g; })(),
    (() => { const g=el('div','grid-3'); g.append(buildDonut('By project','today',DATA.byProject),buildDonut('By command','today · top tools',DATA.byCommand.slice(0,8)),buildLanguages()); return g; })(),
    (() => { const g=el('div','grid-mid'); g.append(buildHourPattern(),buildStreak(),buildProjectBreakdown()); return g; })(),
    (() => { const g=el('div','grid-bot'); g.append(buildTimeline(),buildSummary()); return g; })()
  );
  return main;
}

function buildProjectBreakdown() {
  const card=el('div','card');
  const head=el('div','card-head');
  head.append(el('div','card-title','By project'),el('div','card-sub','time breakdown'));
  card.appendChild(head);
  const list=el('ul','lang-list',null,{style:'gap:12px'});
  list.style.gap='12px';
  DATA.byProject.slice(0,8).forEach(p=>{
    const li=el('li');
    li.style.gridTemplateColumns='10px 1fr 1fr auto';
    const sw=el('span','legend-swatch'); sw.style.background=p.color;
    const bw=el('div','lang-bar-mini');
    const bf=el('span'); bf.style.width=`${(p.min/Math.max(1,DATA.byProject[0].min))*100}%`; bf.style.background=p.color;
    bw.appendChild(bf);
    li.append(sw,el('span','lang-name',p.name),bw,el('span','tnum lang-val',p.min+'m'));
    list.appendChild(li);
  });
  card.appendChild(list);
  return card;
}

function renderWeek() {
  const main=el('main','dashboard');
  main.append(
    buildHeroStrip('this week'),
    DATA.weekDays.length ? buildWeekBars() : el('div',null,''),
    buildWeekHeatmap(),
    (() => { const g=el('div','grid-3'); g.append(buildDonut('By project','this week',DATA.byProject),buildDonut('By command','this week',DATA.byCommand.slice(0,8)),buildLanguages()); return g; })(),
    (() => { const g=el('div','grid-bot'); g.append(buildTimeline(),buildSummary()); return g; })()
  );
  return main;
}

function renderWrongPeriod(requested) {
  const card=el('div','card empty-state');
  const other=requested==='today'?'week':'today';
  card.append(el('h2',null,`${requested.charAt(0).toUpperCase()+requested.slice(1)} view`),
              el('p',null,`This dashboard was generated for the ${DATA.period} period.`),
              el('p',null,el('code',null,`fw dashboard ${requested}`)));
  const main=el('main','dashboard'); main.appendChild(card); return main;
}

// ─────────────────────────────────────────────────────────────
// App init
// ─────────────────────────────────────────────────────────────
const root=document.getElementById('app');
let currentView = DATA.period; // 'today' or 'week'

function render() {
  root.innerHTML='';
  const page=el('div','page');

  page.appendChild(buildHeader(currentView, v => { currentView=v; render(); }));

  if (!DATA.hasData) {
    page.appendChild(buildEmpty());
  } else {
    if (currentView===DATA.period) {
      page.appendChild(currentView==='week' ? renderWeek() : renderToday());
    } else {
      page.appendChild(renderWrongPeriod(currentView));
    }
  }

  const foot=el('footer','foot');
  foot.append(t('flowd'),el('span','dim',' — local activity tracker · self-hosted'));
  page.appendChild(foot);
  root.appendChild(page);

  // Restore theme button state after re-render
  applyTheme(storedTheme);
}

render();
</script>
