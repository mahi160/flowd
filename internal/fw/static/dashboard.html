<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>flowd — dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   flowd — Warm Forest Design System tokens
   ============================================================ */
:root {
  --font-display: "Fraunces", "Cormorant Garamond", Georgia, serif;
  --font-sans: "Instrument Sans", "Söhne", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  --fs-12: 11.5px; --fs-13: 12.5px; --fs-14: 13.5px; --fs-15: 14.5px;
  --fs-16: 15.5px; --fs-18: 17px; --fs-22: 21px; --fs-28: 27px;
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;
  --shadow-sm: 0 1px 0 rgba(20,14,6,.04), 0 1px 2px rgba(20,14,6,.04);
  --shadow-md: 0 1px 0 rgba(20,14,6,.04), 0 6px 18px -8px rgba(20,14,6,.12);
  --moss: oklch(58% 0.12 145); --moss-deep: oklch(42% 0.10 145);
  --fern: oklch(72% 0.12 150); --lichen: oklch(82% 0.10 130);
  --amber: oklch(76% 0.16 75); --amber-deep: oklch(64% 0.18 60);
  --terracotta: oklch(64% 0.15 40); --clay: oklch(72% 0.09 50);
  --bark: oklch(40% 0.06 50); --rose-hip: oklch(60% 0.16 20);
  --pine: oklch(38% 0.08 175); --sage: oklch(70% 0.06 145);
  --mushroom: oklch(60% 0.04 60);
}
:root, [data-theme="dark"] {
  --bg: oklch(16% 0.012 130); --bg-elev-1: oklch(20% 0.014 130);
  --bg-elev-2: oklch(23% 0.016 135); --bg-inset: oklch(14% 0.010 130);
  --surface: oklch(21% 0.014 132); --surface-2: oklch(25% 0.017 134);
  --hairline: oklch(30% 0.018 135 / .9); --hairline-soft: oklch(30% 0.018 135 / .5);
  --ink: oklch(94% 0.012 95); --ink-2: oklch(82% 0.020 95);
  --ink-3: oklch(66% 0.020 95); --ink-4: oklch(52% 0.018 95); --ink-5: oklch(40% 0.016 95);
  --accent: var(--amber); --accent-ink: oklch(20% 0.05 70);
  --accent-soft: oklch(35% 0.08 70 / .35);
  --positive: var(--fern); --warn: var(--amber-deep); --danger: var(--rose-hip);
  --card-glow: radial-gradient(120% 80% at 0% 0%, oklch(60% 0.10 80 / .05), transparent 60%);
  --c1: oklch(70% 0.14 145); --c2: oklch(76% 0.15 75); --c3: oklch(68% 0.14 40);
  --c4: oklch(65% 0.10 175); --c5: oklch(78% 0.10 100); --c6: oklch(64% 0.16 20);
  --c7: oklch(60% 0.08 280); --c8: oklch(72% 0.06 50);
}
[data-theme="light"] {
  --bg: oklch(97% 0.012 85); --bg-elev-1: oklch(99% 0.008 85);
  --bg-elev-2: oklch(100% 0 0); --bg-inset: oklch(94% 0.014 85);
  --surface: oklch(99% 0.008 85); --surface-2: oklch(96% 0.012 85);
  --hairline: oklch(86% 0.014 85); --hairline-soft: oklch(90% 0.012 85);
  --ink: oklch(22% 0.020 60); --ink-2: oklch(34% 0.022 60);
  --ink-3: oklch(48% 0.022 60); --ink-4: oklch(60% 0.022 60); --ink-5: oklch(72% 0.020 60);
  --accent: var(--terracotta); --accent-ink: oklch(99% 0.01 70);
  --accent-soft: oklch(85% 0.06 50 / .6);
  --positive: var(--moss); --warn: var(--amber-deep); --danger: var(--rose-hip);
  --card-glow: radial-gradient(120% 80% at 0% 0%, oklch(85% 0.06 70 / .25), transparent 60%);
  --c1: oklch(52% 0.14 145); --c2: oklch(64% 0.16 70); --c3: oklch(58% 0.16 38);
  --c4: oklch(48% 0.10 175); --c5: oklch(62% 0.10 100); --c6: oklch(54% 0.18 20);
  --c7: oklch(48% 0.10 280); --c8: oklch(56% 0.08 50);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans); font-size: var(--fs-15); line-height: 1.45;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-feature-settings: "ss01","cv11";
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: var(--body-texture, none); opacity: var(--body-texture-opacity, 0);
  mix-blend-mode: overlay;
}
[data-theme="dark"] body {
  --body-texture: radial-gradient(1200px 600px at 80% -10%, oklch(40% 0.08 145 / .15), transparent 60%),
                  radial-gradient(900px 500px at -10% 110%, oklch(40% 0.10 60 / .10), transparent 60%);
  --body-texture-opacity: 1;
}
[data-theme="light"] body {
  --body-texture: radial-gradient(1100px 500px at 90% -10%, oklch(80% 0.08 80 / .35), transparent 60%),
                  radial-gradient(900px 500px at -5% 110%, oklch(85% 0.06 145 / .25), transparent 60%);
  --body-texture-opacity: 1;
}
::selection { background: var(--accent-soft); color: var(--ink); }
.font-display { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.02em; }
.font-mono { font-family: var(--font-mono); font-feature-settings: "ss01"; }
.eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4); }
.hairline { border-top: 1px solid var(--hairline); }
.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r-lg); padding: 22px;
  position: relative; isolation: isolate; overflow: hidden;
}
.card::before {
  content: ""; position: absolute; inset: 0;
  background: var(--card-glow); pointer-events: none; z-index: -1;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: var(--r-pill);
  font-size: var(--fs-12); font-family: var(--font-mono);
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--hairline-soft);
}
.tnum { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-5); }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   Dashboard layout styles
   ============================================================ */
[data-type="sans"] .font-display { font-family: var(--font-sans) !important; font-weight: 600 !important; letter-spacing: -0.025em !important; }
.page { min-height: 100vh; max-width: 1480px; margin: 0 auto; padding: 32px 36px 80px; position: relative; z-index: 1; }
[data-density="compact"] .page { padding: 22px 28px 60px; }
[data-density="spacious"] .page { padding: 48px 56px 96px; }
.header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px; margin-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-name { font-size: 28px; line-height: 1; margin-bottom: 4px; }
.brand-sub { display: flex; align-items: center; gap: 8px; font-size: var(--fs-13); color: var(--ink-3); }
.brand-stamp { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.brand-dot { color: var(--ink-5); }
.status-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--positive); box-shadow: 0 0 0 3px color-mix(in oklch, var(--positive) 25%, transparent); }
.header-right { display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 3px; }
.seg-btn { appearance: none; border: 0; background: transparent; color: var(--ink-3); padding: 7px 16px; font: inherit; font-size: var(--fs-13); border-radius: 7px; cursor: pointer; letter-spacing: 0.01em; }
.seg-btn.is-active { background: var(--bg-elev-2); color: var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,.04); }
.icon-btn { appearance: none; width: 38px; height: 38px; border-radius: 10px; background: var(--surface); border: 1px solid var(--hairline); color: var(--ink-2); cursor: pointer; display: inline-grid; place-items: center; }
.icon-btn:hover { color: var(--ink); border-color: var(--ink-5); }
.dashboard { display: flex; flex-direction: column; gap: 18px; }
[data-density="compact"] .dashboard { gap: 12px; }
[data-density="spacious"] .dashboard { gap: 26px; }
.hero-strip { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 14px; }
.hero-card { padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; min-height: 132px; }
.hero-primary { background: linear-gradient(140deg, var(--surface) 0%, var(--surface-2) 100%); border-color: var(--hairline); }
.hero-primary::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 100% at 100% 0%, color-mix(in oklch, var(--accent) 22%, transparent), transparent 70%); pointer-events: none; }
.hero-num { display: flex; align-items: baseline; gap: 2px; color: var(--accent); font-size: 56px; line-height: 1; margin-top: 6px; }
.hero-unit { font-size: 22px; color: color-mix(in oklch, var(--accent) 60%, var(--ink-3)); margin-right: 8px; font-family: var(--font-display); }
.hero-mid { font-size: 26px; line-height: 1.1; margin-top: 4px; color: var(--ink); }
.hero-sub { font-size: var(--fs-13); color: var(--ink-3); margin-top: 4px; }
.hero-mini { font-size: 11px; color: var(--ink-4); font-family: var(--font-mono); margin-top: auto; padding-top: 8px; }
.dim { color: var(--ink-5); }
.diff-add { color: var(--positive); }
.diff-rm { color: var(--danger); }
.machine-bar { height: 4px; background: var(--bg-inset); border-radius: 999px; margin-top: auto; overflow: hidden; }
.machine-bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--moss), var(--amber)); border-radius: 999px; }
.branch-tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; background: color-mix(in oklch, var(--moss) 18%, transparent); color: color-mix(in oklch, var(--moss) 80%, var(--ink)); border-radius: 6px; font-size: 11px; font-family: var(--font-mono); }
[data-theme="light"] .branch-tag { background: color-mix(in oklch, var(--moss) 22%, transparent); color: var(--moss-deep); }
.sparkline { display: block; margin-top: auto; opacity: .9; }
.card-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.card-title { font-family: var(--font-display); font-size: var(--fs-18); letter-spacing: -0.01em; color: var(--ink); font-weight: 500; }
.card-sub { font-size: var(--fs-12); color: var(--ink-4); font-family: var(--font-mono); }
.grid-act { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; }
.heatmap { padding: 18px 22px; }
.heat-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.heat-cells { display: grid; grid-template-columns: repeat(60, 1fr); gap: 3px; height: 56px; }
.heat-cell { border-radius: 3px; background: color-mix(in oklch, var(--accent) calc(var(--i, 0) * 90%), var(--bg-inset)); border: 1px solid color-mix(in oklch, var(--accent) calc(var(--i, 0) * 30%), var(--hairline-soft)); transition: transform .15s; }
.heat-cell:hover { transform: scale(1.4); z-index: 2; position: relative; }
.heat-axis { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); padding: 0 2px; }
.heat-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-4); font-family: var(--font-mono); padding-top: 4px; }
.heat-legend { display: inline-flex; align-items: center; gap: 4px; }
.heat-legend .heat-cell { width: 12px; height: 12px; }
.heat-peak { color: var(--ink-3); }
.week-heat-grid { display: flex; flex-direction: column; gap: 6px; }
.week-heat-row { display: flex; align-items: center; gap: 8px; }
.week-heat-label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); width: 46px; text-align: right; }
.week-heat-cells { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; flex: 1; height: 18px; }
.insights { padding: 18px 22px; }
.insights-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.insights-icon { width: 32px; height: 32px; border-radius: 10px; background: color-mix(in oklch, var(--accent) 25%, var(--surface)); color: var(--accent); display: grid; place-items: center; border: 1px solid color-mix(in oklch, var(--accent) 35%, var(--hairline)); }
.insight-item { display: flex; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--hairline); align-items: flex-start; }
.insight-item:first-of-type { border-top: 0; padding-top: 0; }
.insight-item p { margin: 0; font-size: var(--fs-13); color: var(--ink-2); line-height: 1.5; }
.insight-item code { background: var(--bg-inset); padding: 0 5px; border-radius: 4px; font-size: 11.5px; font-family: var(--font-mono); }
.insight-tag { flex-shrink: 0; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; background: var(--bg-inset); color: var(--ink-3); border: 1px solid var(--hairline-soft); margin-top: 1px; min-width: 64px; text-align: center; }
.insight-tag.warn { color: var(--warn); border-color: color-mix(in oklch, var(--warn) 40%, transparent); background: color-mix(in oklch, var(--warn) 12%, transparent); }
.insight-tag.good { color: var(--positive); border-color: color-mix(in oklch, var(--positive) 40%, transparent); background: color-mix(in oklch, var(--positive) 12%, transparent); }
.ai-body-full { font-size: var(--fs-13); color: var(--ink-2); line-height: 1.65; white-space: pre-wrap; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.donut-card { display: flex; flex-direction: column; }
.donut-wrap { position: relative; aspect-ratio: 1; max-height: 240px; margin: 4px auto 14px; width: 100%; }
.donut { display: block; width: 100%; height: 100%; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
.donut-total { font-size: 30px; line-height: 1; color: var(--ink); }
.donut-cap { margin-top: 4px; }
.donut-pct { font-size: 32px; line-height: 1; color: var(--accent); }
.donut-name { font-size: var(--fs-13); margin-top: 4px; color: var(--ink-2); }
.donut-val { font-family: var(--font-mono); font-size: 11px; color: var(--ink-4); margin-top: 2px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.legend-row { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 6px; font-size: var(--fs-13); cursor: default; }
.legend-row.is-hover { background: var(--bg-inset); }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; }
.legend-name { color: var(--ink-2); font-family: var(--font-mono); font-size: 12px; }
.legend-val { color: var(--ink-3); font-family: var(--font-mono); font-size: 11.5px; }
.legend-pct { color: var(--ink-4); font-family: var(--font-mono); font-size: 11px; min-width: 30px; text-align: right; }
.lang-card { display: flex; flex-direction: column; }
.lang-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; border: 1px solid var(--hairline-soft); margin-bottom: 16px; margin-top: 4px; }
.lang-seg { display: block; height: 100%; }
.lang-list { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.lang-list li { display: grid; grid-template-columns: 10px 90px 1fr auto; gap: 12px; align-items: center; font-size: var(--fs-13); }
.lang-name { color: var(--ink-2); font-family: var(--font-mono); font-size: 12px; }
.lang-bar-mini { height: 4px; background: var(--bg-inset); border-radius: 999px; overflow: hidden; }
.lang-bar-mini > span { display: block; height: 100%; border-radius: 999px; }
.lang-val { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); }
.lang-foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline-soft); display: flex; justify-content: space-between; align-items: baseline; }
.lang-total { font-size: 22px; color: var(--ink); }
.grid-mid { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr; gap: 14px; }
.hour-card { display: flex; flex-direction: column; }
.hour-bars { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 90px; align-items: end; margin: 8px 0 24px; position: relative; }
.hour-bar { position: relative; height: 100%; display: flex; align-items: flex-end; }
.hour-fill { display: block; width: 100%; height: var(--h, 4%); min-height: 2px; background: linear-gradient(180deg, var(--accent), color-mix(in oklch, var(--accent) 40%, transparent)); border-radius: 2px 2px 0 0; transition: opacity .15s; }
.hour-bar:hover .hour-fill { background: var(--ink); }
.hour-tick { position: absolute; bottom: -18px; left: 0; font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); white-space: nowrap; }
.hour-stats { display: flex; gap: 18px; padding-top: 12px; border-top: 1px solid var(--hairline-soft); }
.hour-stats > div { display: flex; flex-direction: column; gap: 2px; }
.hour-stats .tnum { font-family: var(--font-mono); font-size: var(--fs-13); color: var(--ink); }
.streak-card { display: flex; flex-direction: column; }
.streak-num { font-size: 28px; color: var(--accent); margin-left: 8px; vertical-align: -3px; }
.streak-cells { display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(2, 1fr); gap: 4px; margin: 14px 0; flex: 1; min-height: 80px; }
.streak-cell { aspect-ratio: 1; border-radius: 4px; background: color-mix(in oklch, var(--moss) calc(var(--i, 0) * 80%), var(--bg-inset)); border: 1px solid color-mix(in oklch, var(--moss) calc(var(--i, 0) * 35%), var(--hairline-soft)); }
.streak-foot { display: flex; align-items: center; gap: 12px; font-size: 10px; }
.hairline-streak { flex: 1; height: 1px; background: var(--hairline-soft); }
.grid-bot { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; }
.timeline-card { display: flex; flex-direction: column; }
.timeline { list-style: none; margin: 0; padding: 0; }
.tl-row { display: grid; grid-template-columns: 96px 18px 1fr; gap: 12px; padding: 10px 0; }
.tl-row.tl-idle .tl-body { opacity: .5; }
.tl-time { font-size: 11px; color: var(--ink-3); padding-top: 2px; letter-spacing: 0.02em; font-family: var(--font-mono); }
.tl-rail { position: relative; }
.tl-dot { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 9px; height: 9px; border-radius: 999px; background: var(--c, var(--accent)); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--hairline); z-index: 1; }
.tl-line { position: absolute; left: 50%; top: 16px; bottom: -10px; width: 1px; background: var(--hairline); transform: translateX(-50%); }
.tl-body { padding-bottom: 4px; min-height: 28px; }
.tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tl-project { font-size: var(--fs-15); color: var(--ink); font-weight: 500; }
.tl-branch { font-size: 10.5px; }
.tl-meta { font-size: var(--fs-13); color: var(--ink-3); margin-top: 2px; }
.tl-ai { font-size: var(--fs-13); color: var(--ink-2); background: color-mix(in oklch, var(--accent) 7%, transparent); border-left: 2px solid var(--accent); padding: 7px 10px; border-radius: 0 6px 6px 0; line-height: 1.5; margin-top: 8px; white-space: pre-wrap; }
.tl-bar { height: 3px; background: var(--bg-inset); border-radius: 999px; margin-top: 6px; width: 60%; overflow: hidden; }
.tl-bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--moss), var(--accent)); border-radius: 999px; }
.summary-card { display: flex; flex-direction: column; }
.summary-list { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.summary-list > div { display: grid; grid-template-columns: 88px 1fr; gap: 12px; padding: 12px 0; border-top: 1px dashed var(--hairline); align-items: baseline; }
.summary-list > div:first-child { border-top: 0; padding-top: 4px; }
.summary-list dt { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4); margin: 0; }
.summary-list dd { margin: 0; font-size: var(--fs-13); color: var(--ink-2); line-height: 1.55; }
.summary-list code { background: var(--bg-inset); padding: 0 5px; border-radius: 4px; font-size: 11.5px; font-family: var(--font-mono); }
.foot { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 28px; font-size: 11px; color: var(--ink-4); font-family: var(--font-mono); }
.week-card { padding: 20px 22px 28px; }
.week-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 240px; margin-top: 12px; }
.week-bar { display: flex; flex-direction: column; }
.week-bar-track { flex: 1; background: var(--bg-inset); border-radius: 12px; position: relative; overflow: hidden; }

<script type="text/babel">
/* global React, ReactDOM, __RAW */
const { useState, useMemo, useEffect, useRef, useCallback } = React;

// ============================================================
// TWEAKS PANEL (inline)
// ============================================================
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;

function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', open, onClose, children }) {
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    if (panel) { panel.style.right = offsetRef.current.x + 'px'; panel.style.bottom = offsetRef.current.y + 'px'; }
  }, []);
  useEffect(() => { if (open) { setTimeout(clampToViewport, 0); } }, [open, clampToViewport]);
  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right, startBottom = window.innerHeight - r.bottom;
    const move = (ev) => { offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) }; clampToViewport(); };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={onClose}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title }) { return <div className="twk-sect">{title}</div>; }

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  const valueRef = useRef(value); valueRef.current = value;
  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((clientX - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX); if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map(o => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} role="switch" aria-checked={!!value} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <select className="twk-field" value={value} onChange={e => onChange(e.target.value)}>
        {options.map(o => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o; return <option key={v} value={v}>{l}</option>; })}
      </select>
    </div>
  );
}

// ============================================================
// DATA TRANSFORMATION
// ============================================================
const PALETTE = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)","var(--c8)"];

function objectToArray(obj, valueKey = 'min') {
  return Object.entries(obj || {})
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1])
    .map(([name, value], i) => ({ name, [valueKey]: value, color: PALETTE[i % PALETTE.length] }));
}

function computeHourly(heatmap) {
  // Today: 48 half-hour buckets → 24 hourly
  const hourly = new Array(24).fill(0);
  (heatmap || []).forEach(c => {
    const h = Math.floor(c.hour / 2);
    if (h >= 0 && h < 24) hourly[h] += c.minute;
  });
  return hourly;
}

function computeWeekHourly(heatmap) {
  // Week: 7×24 buckets, group by day
  const byDay = {};
  (heatmap || []).forEach(c => {
    if (!byDay[c.day]) byDay[c.day] = new Array(24).fill(0);
    if (c.hour >= 0 && c.hour < 24) byDay[c.day][c.hour] += c.minute;
  });
  return byDay;
}

function computeWeekDays(heatmap) {
  const byDay = {};
  (heatmap || []).forEach(c => {
    if (!byDay[c.day]) byDay[c.day] = 0;
    byDay[c.day] += c.minute;
  });
  return Object.entries(byDay).map(([label, min]) => {
    const parts = label.split(' ');
    return { day: parts[0] || label, date: parts[1] || '', min };
  });
}

function generateStreakCells(streakDays) {
  return Array.from({ length: 30 }, (_, i) => {
    const daysAgo = 29 - i;
    if (daysAgo < streakDays) {
      // active: vary intensity with simple pattern
      const v = daysAgo === 0 ? 4 : ((i * 7 + 3) % 3) + 2;
      return { d: i, v: Math.min(4, v) };
    }
    // inactive: occasional sparse activity before streak
    const v = (daysAgo < streakDays + 8) ? ((i * 13) % 4 === 0 ? 1 : 0) : 0;
    return { d: i, v };
  });
}

// Build DATA from RAW
const RAW = __RAW;

const byProject = objectToArray(RAW.by_project);
const byCommand = objectToArray(RAW.by_tool);
const byLanguage = objectToArray(RAW.languages, 'min');

const isToday = RAW.period === 'today';
const hourly = isToday ? computeHourly(RAW.heatmap) : (() => {
  // For week view, aggregate all days into one hourly pattern
  const h = new Array(24).fill(0);
  (RAW.heatmap || []).forEach(c => { if (c.hour >= 0 && c.hour < 24) h[c.hour] += c.minute; });
  return h;
})();

const weekDays = computeWeekDays(RAW.heatmap);
const weekHourlyByDay = computeWeekHourly(RAW.heatmap);

const tlMax = Math.max(1, ...(RAW.timeline || []).map(b => b.focus));

const DATA = {
  generatedAt: RAW.generated || '',
  machine: RAW.machine || '—',
  os: RAW.os || '',
  topRepo: { name: RAW.top_repo || '—', branch: RAW.top_branch || '' },
  focus: { totalMin: RAW.total_focus_min || 0, blocks: RAW.total_blocks || 0, switches: RAW.total_switches || 0 },
  code: { files: RAW.files_changed || 0, added: RAW.lines_added || 0, removed: RAW.lines_removed || 0 },
  byProject, byCommand, byLanguage,
  hourly,
  weekDays,
  weekHourlyByDay,
  streak: generateStreakCells(RAW.streak_days || 0),
  streakDays: RAW.streak_days || 0,
  timeline: (RAW.timeline || []).map(t => ({
    from: t.start, to: t.end,
    project: t.repo || null, branch: t.branch || null,
    focus: t.focus, switches: t.switches,
    ai: t.ai || null,
    intensity: Math.min(1, (t.focus || 0) / 30),
  })),
  aiRecap: RAW.ai_recap || null,
  aiPerBlock: RAW.ai_per_block || 0,
  period: RAW.period || 'today',
  hasData: (RAW.total_blocks || 0) > 0,
};

// ============================================================
// HELPERS
// ============================================================
function fmtHM(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  if (h === 0) return `${mm}m`;
  if (mm === 0) return `${h}h`;
  return `${h}h ${mm}m`;
}

function arcPath(cx, cy, rO, rI, startA, endA) {
  const large = endA - startA > Math.PI ? 1 : 0;
  const sx = cx + rO * Math.cos(startA), sy = cy + rO * Math.sin(startA);
  const ex = cx + rO * Math.cos(endA), ey = cy + rO * Math.sin(endA);
  const sxi = cx + rI * Math.cos(endA), syi = cy + rI * Math.sin(endA);
  const exi = cx + rI * Math.cos(startA), eyi = cy + rI * Math.sin(startA);
  return `M ${sx} ${sy} A ${rO} ${rO} 0 ${large} 1 ${ex} ${ey} L ${sxi} ${syi} A ${rI} ${rI} 0 ${large} 0 ${exi} ${eyi} Z`;
}

            : <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/></svg>}

// ============================================================
// HERO STRIP
// ============================================================
function Sparkline() {
  const data = DATA.hourly;
  const W = 220, H = 28;
  const max = Math.max(...data, 1);
  const step = W / (data.length - 1);
  const pts = data.map((v, i) => `${i*step},${H - (v/max)*H}`);
  const path = `M ${pts.join(" L ")}`;
  const area = `${path} L ${W},${H} L 0,${H} Z`;
  return (
    <svg className="sparkline" width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id="sp-fill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor="var(--accent)" stopOpacity="0.45"/>
          <stop offset="1" stopColor="var(--accent)" stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill="url(#sp-fill)"/>
      <path d={path} stroke="var(--accent)" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

          <span className="tnum">{focus.blocks}</span> focus blocks

      </div>
      <div className="hero-card card">
        <div className="eyebrow">Machine</div>
        <div className="hero-mid font-display">{machine}</div>
        <div className="hero-sub">{os}</div>
        <div className="machine-bar"><span style={{width:"50%"}}/></div>
      </div>
      <div className="hero-card card">
        <div className="eyebrow">Top repo</div>
        <div className="hero-mid font-display">{topRepo.name}</div>

    </div>
  );

// ============================================================
// ACTIVITY HEATMAP — today
// ============================================================
function ActivityHeatmap() {
  const cells = useMemo(() => {
    return Array.from({ length: 60 }, (_, i) => {
      const rawHour = 8 + Math.floor(i * 12 / 60); // map 60 cells to 8am-8pm
      const v = DATA.hourly[Math.min(23, rawHour)] || 0;
      const noise = ((i * 13) % 7) / 6;
      const intensity = Math.max(0, Math.min(1, (v / 45) * (0.5 + noise * 0.6)));
      return { i, hour: rawHour, intensity };
    });
  }, []);
  const peak = cells.reduce((a, b) => b.intensity > a.intensity ? b : a, cells[0]);
  return (
    <div className="card heatmap">
      <div className="card-head">
        <div className="card-title">Activity heatmap</div>
        <div className="card-sub">today · focus blocks by start time</div>
      </div>
      <div className="heat-row">
        <div className="heat-axis">
          <span>8a</span><span>10a</span><span>12p</span><span>2p</span><span>4p</span><span>6p</span><span>8p</span>
        </div>
        <div className="heat-cells">
          {cells.map(c => (
            <span key={c.i} className="heat-cell"
              style={{"--i": c.intensity}}
              title={`~${c.hour}:00 — focus ≈${Math.round(c.intensity * 30)}m`} />
          ))}
        </div>
      </div>
      <div className="heat-foot">
        <span className="heat-legend">
          less
          {[0.05, 0.3, 0.55, 0.8, 1].map(v => (
            <span key={v} className="heat-cell" style={{"--i": v}} />
          ))}
          more
        </span>
        {peak.intensity > 0 && (
          <span className="heat-peak">peak ~{peak.hour}:00</span>
        )}
      </div>
    </div>
  );
}

// ============================================================
// DONUT
// ============================================================
function Donut({ title, subtitle, data, valueKey = 'min', unit = 'm', showCenter = true }) {
  const [hover, setHover] = useState(null);
  const total = data.reduce((a, b) => a + (b[valueKey] || 0), 0);
  const W = 240, H = 240, cx = W/2, cy = H/2, rO = 92, rI = 60;
  let acc = -Math.PI / 2;
  const segs = data.map(d => {
    const v = d[valueKey] || 0;
    const frac = total ? v / total : 0;
    const start = acc, end = acc + frac * Math.PI * 2;
    acc = end;
    return { ...d, v, frac, start, end };
  });
  const focused = hover != null ? segs[hover] : null;
  return (
    <div className="card donut-card">
      <div className="card-head">
        <div className="card-title">{title}</div>
        {subtitle && <div className="card-sub">{subtitle}</div>}
      </div>
      {data.length === 0 ? (
        <div style={{color:'var(--ink-4)', fontSize:'var(--fs-13)', padding:'20px 0', textAlign:'center'}}>No data</div>
      ) : (
        <>
          <div className="donut-wrap">
            <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" className="donut">
              {segs.map((s, i) => (
                <path key={s.name} d={arcPath(cx, cy, rO, rI, s.start, s.end)}
                  fill={s.color}
                  opacity={hover == null || hover === i ? 1 : 0.35}
                  onMouseEnter={() => setHover(i)}
                  onMouseLeave={() => setHover(null)}
                  style={{transition:'opacity .2s', cursor:'default'}}/>
              ))}
              <circle cx={cx} cy={cy} r={rI - 1} fill="none" stroke="var(--hairline-soft)" strokeWidth="1"/>
              <circle cx={cx} cy={cy} r={rO + 1} fill="none" stroke="var(--hairline-soft)" strokeWidth="1"/>
            </svg>
            {showCenter && (
              <div className="donut-center">
                {focused ? (
                  <>
                    <div className="donut-pct font-display tnum">{Math.round(focused.frac * 100)}%</div>
                    <div className="donut-name">{focused.name}</div>
                    <div className="donut-val tnum">{focused.v}{unit}</div>
                  </>
                ) : (
                  <>
                    <div className="donut-total font-display tnum">{unit === 'm' ? fmtHM(total) : total.toLocaleString()}</div>
                    <div className="donut-cap eyebrow">total</div>
                  </>
                )}
              </div>
            )}
          </div>
          <ul className="legend">
            {segs.map((s, i) => (
              <li key={s.name} className={`legend-row ${hover === i ? 'is-hover' : ''}`}
                onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
                <span className="legend-swatch" style={{background: s.color}}/>
                <span className="legend-name">{s.name}</span>
                <span className="legend-val tnum">{s.v}{unit}</span>
                <span className="legend-pct tnum">{Math.round(s.frac * 100)}%</span>
              </li>
            ))}
          </ul>
        </>
      )}
    </div>
  );
}

function HourPattern() {
  const data = DATA.hourly;
  const max = Math.max(...data, 1);
  const peakHour = data.indexOf(Math.max(...data));
  const firstActive = data.findIndex(v => v > 0);
  const lastActive = data.reduce((a, v, i) => v > 0 ? i : a, -1);
  const fmtH = h => h === 0 ? '12a' : h < 12 ? `${h}a` : h === 12 ? '12p' : `${h-12}p`;
  return (
    <div className="card hour-card">
      <div className="card-head">
        <div className="card-title">Best hours</div>
        <div className="card-sub">focus by hour-of-day</div>
      </div>
      <div className="hour-bars">
        {data.map((v, i) => (
          <div key={i} className="hour-bar" style={{"--h": `${(v/max)*100}%`}}>
            <span className="hour-fill"/>
            {i % 4 === 0 && <span className="hour-tick">{fmtH(i)}</span>}
          </div>
        ))}
      </div>
      <div className="hour-stats">
        <div><span className="eyebrow">peak</span><span className="tnum">{fmtH(peakHour)}</span></div>
        {firstActive >= 0 && <div><span className="eyebrow">start</span><span className="tnum">{fmtH(firstActive)}</span></div>}
        {lastActive >= 0 && <div><span className="eyebrow">end</span><span className="tnum">{fmtH(lastActive)}</span></div>}
      </div>
    </div>
  );
}

      <TweakSection title="Appearance" />
      <TweakRadio label="Theme" value={tweaks.theme} onChange={v => setTweak('theme', v)}
        options={[{value:'dark',label:'Dark'},{value:'light',label:'Light'}]}/>
      <TweakRadio label="Density" value={tweaks.density} onChange={v => setTweak('density', v)}
        options={[{value:'compact',label:'Compact'},{value:'balanced',label:'Cozy'},{value:'spacious',label:'Airy'}]}/>
      <TweakSelect label="Accent" value={tweaks.accent} onChange={v => setTweak('accent', v)}
        options={[
          {value:'amber',label:'Amber sun'},
          {value:'moss',label:'Moss green'},
          {value:'terracotta',label:'Terracotta'},
          {value:'rose',label:'Rose hip'},
          {value:'pine',label:'Pine'},
        ]}/>
      <TweakRadio label="Type" value={tweaks.type} onChange={v => setTweak('type', v)}
        options={[{value:'editorial',label:'Editorial'},{value:'sans',label:'Sans'}]}/>
      <TweakSection title="Sections" />
      <TweakToggle label="Best hours" value={tweaks.showHourPattern} onChange={v => setTweak('showHourPattern', v)}/>
      <TweakToggle label="Streak" value={tweaks.showStreak} onChange={v => setTweak('showStreak', v)}/>
    </TweaksPanel>
  );
}

// ============================================================
// APP ROOT
// ============================================================
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  // Determine initial view from period
  const initialView = DATA.period === 'week' ? 'Week' : 'Today';
  const [view, setView] = useState(initialView);
  const theme = tweaks.theme;

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-density', tweaks.density);
    document.documentElement.setAttribute('data-type', tweaks.type);
    const accent = ACCENTS[tweaks.accent] || ACCENTS.amber;
    document.documentElement.style.setProperty('--accent', accent);
  }, [theme, tweaks.density, tweaks.type, tweaks.accent]);

  // Keyboard shortcut T to open tweaks
  useEffect(() => {
    const handler = (e) => {
      if (e.key === 't' && !e.metaKey && !e.ctrlKey && !e.altKey &&
          !['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) {
        setTweaksOpen(o => !o);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  return (
    <div className="page">
      <Header
        view={view} setView={setView}
        theme={theme} setTheme={t => setTweak('theme', t)}
        onTweaks={() => setTweaksOpen(o => !o)}
      />

      {!DATA.hasData ? (
        <EmptyState />
      ) : (
        <main className="dashboard">
          {view === 'Today' ? (
            DATA.period === 'today'
              ? <TodayView tweaks={tweaks} />
              : (
                <div className="card empty-state">
                  <h2>Today view</h2>
                  <p>This dashboard was generated for the <strong>week</strong> period.</p>
                  <p>Run <code>fw dashboard today</code> for today's data.</p>
                </div>
              )
          ) : (
            DATA.period === 'week'
              ? <WeekView />
              : (
                <div className="card empty-state">
                  <h2>Week view</h2>
                  <p>This dashboard was generated for <strong>today</strong>.</p>
                  <p>Run <code>fw dashboard week</code> for the weekly view.</p>
                </div>
              )
          )}
        </main>
      )}

      <footer className="foot">
        <span>flowd</span>
        <span className="dim">— local activity tracker · self-hosted ·</span>
        <code className="font-mono">press T for tweaks</code>
      </footer>

      <FlowTweaks tweaks={tweaks} setTweak={setTweak} open={tweaksOpen} onClose={() => setTweaksOpen(false)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
